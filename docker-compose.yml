services:
  scarletx-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: scarletx-backend
    restart: unless-stopped
    environment:
      TZ: America/Los_Angeles
      SCARLETX_HOST: 0.0.0.0
      SCARLETX_PORT: "8000"
      SCARLETX_DATABASE_URL: sqlite:////config/scarletx.db
      SCARLETX_USENET_INCOMPLETE_DIR: /downloads/incomplete
      SCARLETX_USENET_COMPLETE_DIR: /downloads/complete
      SCARLETX_GENERATED_DIR: /config/generated
      SCARLETX_CACHE_DIR: /config/cache
      SCARLETX_DEFAULT_MEDIA_ROOT: /tmp
      SCARLETX_NO_BROWSER: "1"
    volumes:
      - ./docker-data/config:/config
      - ./docker-data/downloads:/downloads
      - ./docker-data/media:/media
      - ./docker-data/backups:/backups

  scarletx-web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: scarletx-web
    restart: unless-stopped
    depends_on:
      scarletx-backend:
        condition: service_healthy
    ports:
      - "8690:8690"
