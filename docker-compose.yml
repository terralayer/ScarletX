services:
  scarletx-permissions:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: scarletx-permissions
    user: "0:0"
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command: >-
      chown -R 568:568 /config /downloads /backups &&
      find /media -type d -exec chown 568:568 {} +
    healthcheck:
      disable: true
    volumes:
      - ./docker-data/config:/config
      - ./docker-data/downloads:/downloads
      - ./docker-data/media:/media
      - ./docker-data/backups:/backups

  scarletx-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: scarletx-backend
    restart: unless-stopped
    depends_on:
      scarletx-permissions:
        condition: service_completed_successfully
    environment:
      TZ: America/Los_Angeles
      SCARLETX_HOST: 0.0.0.0
      SCARLETX_PORT: "8000"
      SCARLETX_TRUST_PROXY_HEADERS: "1"
      SCARLETX_DATABASE_URL: sqlite:////config/scarletx.db
      SCARLETX_USENET_INCOMPLETE_DIR: /downloads/incomplete
      SCARLETX_USENET_COMPLETE_DIR: /downloads/complete
      SCARLETX_GENERATED_DIR: /config/generated
      SCARLETX_CACHE_DIR: /config/cache
      SCARLETX_DEFAULT_MEDIA_ROOT: /tmp
    volumes:
      - ./docker-data/config:/config
      - ./docker-data/downloads:/downloads
      - ./docker-data/media:/media
      - ./docker-data/backups:/backups
    networks:
      - scarletx-net
      - scarletx-egress

  scarletx-web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: scarletx-web
    restart: unless-stopped
    environment:
      SCARLETX_WEB_PORT: "${SCARLETX_WEB_PORT:-8690}"
      SCARLETX_BACKEND_HOST: "${SCARLETX_BACKEND_HOST:-scarletx-backend}"
      SCARLETX_BACKEND_PORT: "${SCARLETX_BACKEND_PORT:-8000}"
    depends_on:
      scarletx-backend:
        condition: service_healthy
    ports:
      - "${SCARLETX_WEB_PORT:-8690}:${SCARLETX_WEB_PORT:-8690}"
    networks:
      - scarletx-net

networks:
  scarletx-net:
    driver: bridge
    internal: true
  scarletx-egress:
    driver: bridge
