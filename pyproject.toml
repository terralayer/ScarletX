[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scarletx"
version = "0.3.8"
description = "Self-hosted adult scene management and automation"
license = "AGPL-3.0-only"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.32,<1",
  "pillow>=10,<13",
  "watchdog>=4,<7",
  "orjson>=3.10,<4",
  "pwdlib[argon2]>=0.2,<1",
  "cryptography>=50,<51",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<2", "ruff>=0.8,<1"]

[tool.hatch.build.targets.wheel]
packages = ["scarletx"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110