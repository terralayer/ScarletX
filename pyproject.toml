[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scarletx"
version = "0.3.9"
description = "Self-hosted adult scene management and automation"
license = "AGPL-3.0-only"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.32,<1",
  "pillow>=10,<13",
  "watchdog>=4,<7",
  "orjson>=3.10,<4",
  "pwdlib[argon2]>=0.2,<1",
  "cryptography>=50,<51",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1", "ruff>=0.8,<1"]

[tool.hatch.build.targets.wheel]
packages = ["scarletx"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
extend-exclude = ["scarletx/settings_store.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"scarletx/automation.py" = ["E401", "E701", "E702", "F401"]
"scarletx/main.py" = ["E701", "E702", "F401"]
"scarletx/media_library.py" = ["E701", "E702"]
"scarletx/metadata.py" = ["E701"]
"scarletx/native_usenet.py" = ["F401"]
"scarletx/rss.py" = ["E701", "E702"]
"scarletx/services.py" = ["E701", "E702"]
"scarletx/studio_art.py" = ["E702", "F841"]
"scarletx/tpdb.py" = ["E702"]
"scarletx/wanted.py" = ["E701", "E702"]
"tests/test_hardening_039.py" = ["F401"]
