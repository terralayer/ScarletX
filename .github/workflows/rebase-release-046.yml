name: Rebase ScarletX 0.4.6

on:
  push:
    branches: [release/0.4.6]

permissions:
  contents: write

jobs:
  rebase:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: release/0.4.6
          fetch-depth: 0
      - name: Merge latest main and preserve 0.4.6 markers
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          set +e
          git merge --no-commit --no-ff origin/main
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            conflicts="$(git diff --name-only --diff-filter=U)"
            if [ "$conflicts" != "scarletx/routes/application.py" ]; then
              echo "Unexpected merge conflicts:" >&2
              echo "$conflicts" >&2
              exit 1
            fi
            git checkout --theirs scarletx/routes/application.py
            python - <<'PY'
          from pathlib import Path
          path = Path("scarletx/routes/application.py")
          text = path.read_text(encoding="utf-8")
          text = text.replace('0.4.5', '0.4.6')
          path.write_text(text, encoding="utf-8")
          PY
            git add scarletx/routes/application.py
          fi
          git commit -m "chore: merge latest main into 0.4.6 release"
          git push origin HEAD:release/0.4.6
