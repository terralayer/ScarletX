name: Release ScarletX 0.3.8

on:
  push:
    branches: [main]

concurrency:
  group: release-scarletx-0.3.8
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check whether 0.3.8 is already released
        id: gate
        shell: bash
        run: |
          if git rev-parse --verify --quiet refs/tags/v0.3.8 >/dev/null; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.gate.outputs.needed == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Apply 0.3.8 release metadata
        if: steps.gate.outputs.needed == 'true'
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              "pyproject.toml": [('version = "0.3.7"', 'version = "0.3.8"')],
              "scarletx/__init__.py": [('__version__ = "0.3.7"', '__version__ = "0.3.8"')],
              "scarletx/main.py": [
                  ('version="0.3.7"', 'version="0.3.8"'),
                  ('"version": "0.3.7"', '"version": "0.3.8"'),
              ],
              "README.md": [
                  ('Current application version: **0.3.7**.', 'Current application version: **0.3.8**.'),
                  ('RELEASE-NOTES-0.3.7.md', 'RELEASE-NOTES-0.3.8.md'),
              ],
              "BUILD-INFO.txt": [('ScarletX 0.3.7', 'ScarletX 0.3.8')],
              "start-scarletx.sh": [('ScarletX 0.3.7', 'ScarletX 0.3.8')],
              "Start-ScarletX.ps1": [('ScarletX 0.3.7', 'ScarletX 0.3.8')],
              "docker-compose.truenas.yml": [(':0.3.7', ':0.3.8')],
              "scarletx/tpdb.py": [('ScarletX/0.3.7', 'ScarletX/0.3.8')],
              "scarletx/remote_art.py": [('ScarletX/0.3.7', 'ScarletX/0.3.8')],
              "scarletx/newznab.py": [('ScarletX/0.3.7', 'ScarletX/0.3.8')],
              "scarletx/native_usenet.py": [('ScarletX/0.3.7', 'ScarletX/0.3.8')],
              "packaging/truenas/scarletx/app.yaml": [
                  ('app_version: 0.3.7', 'app_version: 0.3.8'),
                  ('RELEASE-NOTES-0.3.7.md', 'RELEASE-NOTES-0.3.8.md'),
              ],
              "packaging/truenas/scarletx/ix_values.yaml": [('tag: 0.3.7', 'tag: 0.3.8')],
              "tests/test_release_contract.py": [('0.3.7', '0.3.8')],
          }

          for filename, edits in replacements.items():
              path = Path(filename)
              text = path.read_text(encoding="utf-8")
              for old, new in edits:
                  if old not in text:
                      raise SystemExit(f"Expected release marker not found in {filename}: {old}")
                  text = text.replace(old, new)
              path.write_text(text, encoding="utf-8")
          PY

      - name: Install project and validation dependencies
        if: steps.gate.outputs.needed == 'true'
        run: |
          python -m pip install --disable-pip-version-check --editable '.[dev]'
          python -m pip install --disable-pip-version-check pyyaml psutil pytest-cov bcrypt

      - name: Verify Python release tree
        if: steps.gate.outputs.needed == 'true'
        run: |
          python -m pytest -q
          python -m compileall -q scarletx tests

      - name: Build release container images
        if: steps.gate.outputs.needed == 'true'
        run: |
          docker build -t scarletx-backend:release .
          docker build -f Dockerfile.web -t scarletx-web:release .

      - name: Validate TrueNAS release render
        if: steps.gate.outputs.needed == 'true'
        shell: bash
        run: |
          git clone --depth 1 https://github.com/truenas/apps.git /tmp/truenas-apps
          rm -rf /tmp/truenas-apps/ix-dev/community/scarletx
          cp -a packaging/truenas/scarletx /tmp/truenas-apps/ix-dev/community/scarletx
          cd /tmp/truenas-apps
          ./.github/scripts/ci.py --app scarletx --train community --test-file basic-values.yaml --render-only=true

      - name: Commit 0.3.8 release metadata
        if: steps.gate.outputs.needed == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/release-0.3.8.yml
          git add pyproject.toml scarletx README.md BUILD-INFO.txt start-scarletx.sh Start-ScarletX.ps1 docker-compose.truenas.yml packaging/truenas/scarletx tests/test_release_contract.py RELEASE-NOTES-0.3.8.md
          git commit -m "Release ScarletX 0.3.8"
          git push origin HEAD:main

      - name: Log in to GitHub Container Registry
        if: steps.gate.outputs.needed == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish 0.3.8 backend and web images
        if: steps.gate.outputs.needed == 'true'
        shell: bash
        run: |
          docker tag scarletx-backend:release ghcr.io/terralayer/scarletx:0.3.8
          docker tag scarletx-backend:release ghcr.io/terralayer/scarletx:main
          docker tag scarletx-web:release ghcr.io/terralayer/scarletx-web:0.3.8
          docker tag scarletx-web:release ghcr.io/terralayer/scarletx-web:main
          docker push ghcr.io/terralayer/scarletx:0.3.8
          docker push ghcr.io/terralayer/scarletx:main
          docker push ghcr.io/terralayer/scarletx-web:0.3.8
          docker push ghcr.io/terralayer/scarletx-web:main

      - name: Verify anonymous release image pulls
        if: steps.gate.outputs.needed == 'true'
        shell: bash
        run: |
          docker logout ghcr.io
          for image in ghcr.io/terralayer/scarletx:0.3.8 ghcr.io/terralayer/scarletx-web:0.3.8; do
            pulled=false
            for attempt in $(seq 1 36); do
              if docker pull "$image"; then
                pulled=true
                break
              fi
              echo "$image not anonymously pullable yet; retrying in 10 seconds ($attempt/36)"
              sleep 10
            done
            test "$pulled" = true
          done

      - name: Deploy and health-check 0.3.8 through TrueNAS CI
        if: steps.gate.outputs.needed == 'true'
        working-directory: /tmp/truenas-apps
        run: ./.github/scripts/ci.py --app scarletx --train community --test-file basic-values.yaml

      - name: Create v0.3.8 tag and GitHub release
        if: steps.gate.outputs.needed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          git fetch origin main
          git checkout --detach origin/main
          test "$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')" = "0.3.8"
          git tag -a v0.3.8 -m "ScarletX 0.3.8"
          git push origin v0.3.8
          gh release create v0.3.8 --title "ScarletX 0.3.8" --notes-file RELEASE-NOTES-0.3.8.md --verify-tag
