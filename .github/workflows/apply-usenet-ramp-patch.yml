name: Apply Usenet Ramp Patch

on:
  push:
    branches: [fix/native-usenet-adaptive-ramp]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/native-usenet-adaptive-ramp
      - name: Apply exact patch
        run: python tools/apply_usenet_ramp_patch.py
      - name: Verify only expected worker sections changed
        run: |
          git diff --check
          git diff -- scarletx/usenet/worker.py
      - name: Commit surgical patch and remove helpers
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scarletx/usenet/worker.py
          git rm tools/apply_usenet_ramp_patch.py .github/workflows/apply-usenet-ramp-patch.yml
          git commit -m 'perf: ramp native Usenet concurrency aggressively'
          git push
