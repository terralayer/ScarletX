name: Prepare ScarletX 0.4.5 metadata

on:
  push:
    branches: ["release/0.4.5"]
    paths:
      - ".github/workflows/prepare-045.yml"

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release branch
        uses: actions/checkout@v5
        with:
          ref: release/0.4.5
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Advance release lock and apply repository release helper
        env:
          RELEASE_NOTES: >-
            Synchronizes all ScarletX changes merged since 0.4.4 into a single stable release. Includes the approved ScarletX branding and favicon corrections, consistent vector navigation icons, processing queue and activity-history improvements, Wanted state tracking, quality profiles and safe automatic upgrades, safer matching/rename/import/cleanup flows, incremental scanning, duplicate detection, library health reporting, resource/backpressure protections, and the locked dashboard/footer correction that removes the CSS-generated “Built with ♥ for the scene.” pseudo-footer so the sidebar terminates at the real application footer.
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path("tools/release_version.py")
          text = path.read_text(encoding="utf-8")
          old = 'LOCKED_RELEASE_VERSION = "0.4.4"'
          new = 'LOCKED_RELEASE_VERSION = "0.4.5"'
          if old not in text:
              raise SystemExit("Expected 0.4.4 release lock was not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          APPLIED_VERSION="$(python tools/release_version.py apply --notes "$RELEASE_NOTES")"
          test "$APPLIED_VERSION" = "0.4.5"
          python - <<'PY'
          from pathlib import Path
          path = Path("docs/RELEASE-DISCIPLINE.md")
          text = path.read_text(encoding="utf-8")
          if "0.4.4" not in text:
              raise SystemExit("Expected 0.4.4 release discipline lock was not found")
          path.write_text(text.replace("0.4.4", "0.4.5"), encoding="utf-8")
          PY

      - name: Commit prepared release metadata
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            pyproject.toml \
            scarletx/__init__.py \
            scarletx/routes/application.py \
            README.md \
            BUILD-INFO.txt \
            start-scarletx.sh \
            Start-ScarletX.ps1 \
            docker-compose.truenas.yml \
            scarletx/tpdb.py \
            scarletx/remote_art.py \
            scarletx/newznab.py \
            scarletx/usenet/worker.py \
            packaging/truenas/scarletx/app.yaml \
            packaging/truenas/scarletx/ix_values.yaml \
            packaging/truenas/scarletx/questions.yaml \
            tools/release_version.py \
            docs/RELEASE-DISCIPLINE.md \
            RELEASE-NOTES-0.4.5.md
          git diff --cached --check
          git commit -m "chore(release): prepare ScarletX 0.4.5 metadata"
          git push origin HEAD:release/0.4.5
