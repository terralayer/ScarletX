name: PR9 Characterize

on:
  push:
    branches: [refactor/0.3.10-module-boundaries]

permissions:
  contents: write

jobs:
  characterize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v5
        with:
          ref: refactor/0.3.10-module-boundaries
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check --editable '.[dev]'
      - name: Freeze contracts and test them before extraction
        shell: bash
        run: |
          mkdir -p tests/fixtures
          python - <<'PY'
          import json
          import re
          from pathlib import Path
          from scarletx.app import app

          routes = []
          for route in app.routes:
              path = getattr(route, 'path', None)
              methods = sorted(getattr(route, 'methods', None) or [])
              if path and methods:
                  routes.append({'path': path, 'methods': methods})
          routes.sort(key=lambda item: (item['path'], item['methods']))
          Path('tests/fixtures/route_contract_0310.json').write_text(
              json.dumps(routes, indent=2, sort_keys=True) + '\n'
          )

          html = Path('frontend/index.html').read_text(encoding='utf-8')
          ids = sorted(set(re.findall(r'\bid=["\']([^"\']+)["\']', html)))
          Path('tests/fixtures/dom_ids_0310.json').write_text(
              json.dumps(ids, indent=2) + '\n'
          )
          PY
          cat > tests/test_module_boundaries.py <<'PY'
          from __future__ import annotations

          import json
          import re
          from pathlib import Path

          from fastapi.routing import APIRoute

          ROOT = Path(__file__).resolve().parents[1]
          ROUTES = ROOT / 'tests' / 'fixtures' / 'route_contract_0310.json'
          DOM_IDS = ROOT / 'tests' / 'fixtures' / 'dom_ids_0310.json'


          def route_contract(app):
              rows = []
              for route in app.routes:
                  path = getattr(route, 'path', None)
                  methods = sorted(getattr(route, 'methods', None) or [])
                  if path and methods:
                      rows.append({'path': path, 'methods': methods})
              return sorted(rows, key=lambda item: (item['path'], item['methods']))


          def test_route_and_method_contract_is_stable():
              from scarletx.app import app

              assert route_contract(app) == json.loads(ROUTES.read_text())
              assert any(isinstance(route, APIRoute) for route in app.routes)


          def test_native_usenet_public_imports_remain_available():
              from scarletx.native_usenet import SegmentFetcher, process_job, queue_rows

              assert SegmentFetcher and process_job and queue_rows


          def test_frontend_dom_ids_are_stable():
              html = (ROOT / 'frontend' / 'index.html').read_text(encoding='utf-8')
              current = sorted(set(re.findall(r'\bid=["\']([^"\']+)["\']', html)))
              assert current == json.loads(DOM_IDS.read_text())


          def test_authentication_boot_and_static_assets_remain_supported():
              html = (ROOT / 'frontend' / 'index.html').read_text(encoding='utf-8')
              auth = (ROOT / 'frontend' / 'auth.js').read_text(encoding='utf-8')
              dockerfile = (ROOT / 'Dockerfile.web').read_text(encoding='utf-8')

              assert 'boot();' in html or 'authGateBoot(boot);' in html
              assert 'window.authGateBoot' in auth
              assert 'COPY frontend/index.html' in dockerfile
              assert 'COPY frontend/auth.css' in dockerfile
              assert 'COPY frontend/auth.js' in dockerfile
          PY
          python -m pytest tests/test_module_boundaries.py tests/test_auth_ui.py tests/test_ui_theme.py -q
      - name: Commit characterization fixtures
        run: |
          rm .github/workflows/pr9-characterize.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/test_module_boundaries.py tests/fixtures/route_contract_0310.json tests/fixtures/dom_ids_0310.json .github/workflows/pr9-characterize.yml
          git commit -m 'test: freeze PR9 behavior contracts'
          git push origin HEAD:refactor/0.3.10-module-boundaries
