name: Repair prerelease version characterization

on:
  push:
    branches: [release/0.3.10]
    paths:
      - .github/workflows/fix-beta-version-test.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: release/0.3.10
      - name: Replace hard-coded released version assertion
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/test_status_console.py')
          text = path.read_text(encoding='utf-8')
          old = '''def test_main_and_pyproject_remain_at_released_039_version():
    root = Path(__file__).resolve().parents[1]
    pyproject = (root / "pyproject.toml").read_text()
    main_source = (root / "scarletx" / "routes" / "application.py").read_text()
    assert 'version = "0.3.9"' in pyproject
    assert 'version="0.3.9"' in main_source
'''
          new = '''def test_main_and_pyproject_report_same_current_version():
    root = Path(__file__).resolve().parents[1]
    pyproject = (root / "pyproject.toml").read_text()
    main_source = (root / "scarletx" / "routes" / "application.py").read_text()
    match = re.search(r'(?m)^version = "([^"]+)"$', pyproject)
    assert match is not None
    version = match.group(1)
    assert f'version="{version}"' in main_source
'''
          if old not in text:
              raise SystemExit('Expected hard-coded 0.3.9 characterization block not found')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          git rm .github/workflows/fix-beta-version-test.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_status_console.py
          git commit -m "test: make status version contract release-aware"
          git push origin HEAD:release/0.3.10
