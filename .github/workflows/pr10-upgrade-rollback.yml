name: PR10 Upgrade Rollback Proof

on:
  pull_request:
    branches: [release/0.3.10]
  workflow_dispatch:

permissions:
  contents: read

env:
  PROOF_ROOT: /tmp/scarletx-pr10-upgrade
  PROOF_CONFIG: /tmp/scarletx-pr10-upgrade/config
  PROOF_BACKUP: /tmp/scarletx-pr10-upgrade/config-039-backup
  STABLE_IMAGE: ghcr.io/terralayer/scarletx:0.3.9
  CANDIDATE_IMAGE: scarletx-backend:candidate
  PROOF_CONTAINER: scarletx-upgrade-check

jobs:
  upgrade-rollback:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out candidate
        uses: actions/checkout@v5

      - name: Build candidate backend
        run: docker build --file Dockerfile --tag "$CANDIDATE_IMAGE" .

      - name: Pull released 0.3.9 backend
        run: docker pull "$STABLE_IMAGE"

      - name: Prepare upgrade proof state
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf "$PROOF_ROOT"
          mkdir -p "$PROOF_CONFIG"
          chmod 0777 "$PROOF_CONFIG"
          cat > "$RUNNER_TEMP/run-scarletx-proof-image" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          image="$1"
          docker rm -f scarletx-upgrade-check >/dev/null 2>&1 || true
          docker run -d --name scarletx-upgrade-check \
            -v /tmp/scarletx-pr10-upgrade/config:/config \
            --tmpfs /downloads:uid=568,gid=568 \
            --tmpfs /media:uid=568,gid=568 \
            --tmpfs /backups:uid=568,gid=568 \
            -p 18000:8000 "$image" >/dev/null
          for _ in $(seq 1 160); do
            if curl --fail --silent http://127.0.0.1:18000/api/health >/dev/null; then
              exit 0
            fi
            sleep 0.25
          done
          docker logs scarletx-upgrade-check
          exit 1
          EOF
          chmod +x "$RUNNER_TEMP/run-scarletx-proof-image"

      - name: Boot released 0.3.9 schema
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/run-scarletx-proof-image" "$STABLE_IMAGE"
          docker rm -f "$PROOF_CONTAINER" >/dev/null

      - name: Populate 0.3.9 state and snapshot
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -v "$PROOF_CONFIG:/config" --entrypoint python "$STABLE_IMAGE" -c \
            'from scarletx.db import SessionLocal; from scarletx.models import Scene; from scarletx.secret_store import encrypt_secret; db=SessionLocal(); db.add(Scene(tpdb_id="pr10-upgrade-marker", title="PR10 0.3.9 Upgrade Marker")); db.commit(); db.close(); token=encrypt_secret("pr10-rollback-secret"); assert token.startswith("enc:v1:")'
          test -s "$PROOF_CONFIG/scarletx.db"
          sudo test -s "$PROOF_CONFIG/.scarletx-secret.key"
          test "$(sudo stat -c '%a' "$PROOF_CONFIG/.scarletx-secret.key")" = "600"
          sudo sha256sum "$PROOF_CONFIG/scarletx.db" | awk '{print $1}' | sudo tee "$PROOF_ROOT/db-before.sha256" >/dev/null
          sudo sha256sum "$PROOF_CONFIG/.scarletx-secret.key" | awk '{print $1}' | sudo tee "$PROOF_ROOT/key-before.sha256" >/dev/null
          sudo cp -a "$PROOF_CONFIG" "$PROOF_BACKUP"

      - name: Upgrade populated 0.3.9 state to candidate
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/run-scarletx-proof-image" "$CANDIDATE_IMAGE"
          docker exec "$PROOF_CONTAINER" python -c \
            'from scarletx.db import SessionLocal; from scarletx.models import Scene; db=SessionLocal(); row=db.query(Scene).filter(Scene.tpdb_id=="pr10-upgrade-marker").one(); assert row.title=="PR10 0.3.9 Upgrade Marker"; db.close()'
          docker rm -f "$PROOF_CONTAINER" >/dev/null
          key_before=$(cat "$PROOF_ROOT/key-before.sha256")
          test "$(sudo sha256sum "$PROOF_CONFIG/.scarletx-secret.key" | awk '{print $1}')" = "$key_before"
          test "$(sudo stat -c '%a' "$PROOF_CONFIG/.scarletx-secret.key")" = "600"

      - name: Restore preserved 0.3.9 snapshot
        shell: bash
        run: |
          set -euo pipefail
          db_before=$(cat "$PROOF_ROOT/db-before.sha256")
          key_before=$(cat "$PROOF_ROOT/key-before.sha256")
          sudo rm -rf "$PROOF_CONFIG"
          sudo cp -a "$PROOF_BACKUP" "$PROOF_CONFIG"
          sudo chmod 0777 "$PROOF_CONFIG"
          test "$(sudo sha256sum "$PROOF_CONFIG/scarletx.db" | awk '{print $1}')" = "$db_before"
          test "$(sudo sha256sum "$PROOF_CONFIG/.scarletx-secret.key" | awk '{print $1}')" = "$key_before"
          test "$(sudo stat -c '%a' "$PROOF_CONFIG/.scarletx-secret.key")" = "600"

      - name: Roll back to released 0.3.9
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/run-scarletx-proof-image" "$STABLE_IMAGE"
          docker exec "$PROOF_CONTAINER" python -c \
            'from scarletx.db import SessionLocal; from scarletx.models import Scene; from scarletx.secret_store import encrypt_secret, decrypt_secret; db=SessionLocal(); row=db.query(Scene).filter(Scene.tpdb_id=="pr10-upgrade-marker").one(); assert row.title=="PR10 0.3.9 Upgrade Marker"; db.close(); token=encrypt_secret("rollback-roundtrip"); assert decrypt_secret(token)=="rollback-roundtrip"'
          docker rm -f "$PROOF_CONTAINER" >/dev/null
          echo "UPGRADE_FROM_039=passed"
          echo "ROLLBACK_TO_039=passed"
          echo "SECRET_KEY_PRESERVED=passed"
          echo "POPULATED_RECORD_PRESERVED=passed"

      - name: Clean up proof container
        if: always()
        shell: bash
        run: docker rm -f "$PROOF_CONTAINER" >/dev/null 2>&1 || true
