name: Apply Provider Balance Patch

on:
  push:
    branches:
      - perf/usenet-fill-all-providers
    paths:
      - .github/workflows/apply-provider-balance-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: perf/usenet-fill-all-providers
      - name: Apply exact patch
        run: python scripts/apply_provider_balance_patch.py
      - name: Verify surgical diff
        run: |
          git diff --check
          test "$(git diff --name-only)" = "scarletx/usenet/worker.py"
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scarletx/usenet/worker.py
          git rm .github/workflows/apply-provider-balance-patch.yml scripts/apply_provider_balance_patch.py
          git commit -m 'perf: balance native Usenet provider capacity'
          git push
