name: Apply event driven performance patch

on:
  push:
    paths:
      - ".github/workflows/apply-event-driven-perf.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: perf/event-driven-background-work
      - name: Patch background loops and media tools
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          worker = Path('scarletx/usenet/worker.py')
          s = worker.read_text()
          anchor = 'from ..archive_security import parse_7z_listing, validate_archive_member_path, validate_extracted_tree\n'
          assert anchor in s
          s = s.replace(anchor, anchor + 'from ..background_signals import completed_import_signal, native_queue_signal\n', 1)
          anchor2 = 'from ..release_policy import MIN_RELEASE_BYTES, payload_name_is_ignored\n'
          assert anchor2 in s
          s = s.replace(anchor2, anchor2 + '\nNATIVE_QUEUE_RECOVERY_SECONDS = 60\n', 1)

          old = '''        if existing:\n            return existing.id\n        job_id = "sx-" + uuid.uuid4().hex\n        db.add(NativeUsenetJob(id=job_id, title=title, nzb_url=url, status="queued"))\n        db.commit()\n    return job_id\n'''
          new = '''        if existing:\n            native_queue_signal.notify()\n            return existing.id\n        job_id = "sx-" + uuid.uuid4().hex\n        db.add(NativeUsenetJob(id=job_id, title=title, nzb_url=url, status="queued"))\n        db.commit()\n    native_queue_signal.notify()\n    return job_id\n'''
          assert old in s
          s = s.replace(old, new, 1)

          pat = re.compile(r'(            _set_job\(\n                session_factory,\n                job_id,\n                status="completed",.*?\n                unpack_password=None,\n            \)\n)(            _clear_live_progress\(job_id\))', re.S)
          s, count = pat.subn(r'\1            completed_import_signal.notify()\n\2', s, count=1)
          assert count == 1, count

          loop_pat = re.compile(r'async def native_worker_loop\(session_factory, settings_loader, poll_seconds: float = 5\.0\) -> None:\n.*?(?=\n\ndef queue_rows)', re.S)
          loop = '''async def native_worker_loop(session_factory, settings_loader, poll_seconds: float = 5.0) -> None:\n    emit_status("Native Downloader", "ACTIVE", "event driven; 60s recovery fallback", severity="active")\n    await native_queue_signal.bind()\n    # Jobs interrupted by an app restart are safe to retry because decoded segments\n    # are persisted under the incomplete directory and skipped on the next pass.\n    with session_factory() as db:\n        db.execute(update(NativeUsenetJob).where(NativeUsenetJob.status.in_(["downloading", "postprocessing"])).values(status="queued", speed_bps=0.0, eta_seconds=None))\n        db.commit()\n    while True:\n        with session_factory() as db:\n            job = db.scalar(select(NativeUsenetJob).where(NativeUsenetJob.status == "queued").order_by(NativeUsenetJob.created_at.asc()).limit(1))\n            job_id = job.id if job else None\n        if not job_id:\n            await native_queue_signal.wait(NATIVE_QUEUE_RECOVERY_SECONDS)\n            continue\n        settings = settings_loader()\n        await process_job(session_factory, settings, job_id)\n'''
          s, count = loop_pat.subn(loop, s, count=1)
          assert count == 1, count
          worker.write_text(s)

          app = Path('scarletx/routes/application.py')
          s = app.read_text()
          anchor = 'from ..event_stream import QueueEvent, format_sse, queue_event_broker, queue_event_pump\n'
          assert anchor in s
          s = s.replace(anchor, anchor + 'from ..background_signals import completed_import_signal\nfrom ..runtime_metrics import runtime_metrics\n', 1)
          anchor = 'MONITORED_ENTITY_DISCOVERY_INTERVAL_SECONDS = 3600\n'
          assert anchor in s
          s = s.replace(anchor, 'COMPLETED_IMPORT_RECOVERY_SECONDS = 120\n' + anchor, 1)

          loop_pat = re.compile(r'async def completed_download_import_loop\(\) -> None:\n.*?(?=\n\nasync def )', re.S)
          match = loop_pat.search(s)
          assert match, 'completed import loop not found'
          old_loop = match.group(0)
          assert 'process_completed_downloads' in old_loop
          new_loop = '''async def completed_download_import_loop() -> None:\n    await completed_import_signal.bind()\n    while True:\n        wait_seconds = COMPLETED_IMPORT_RECOVERY_SECONDS\n        try:\n            result = await process_completed_downloads()\n            wait_seconds = min(\n                COMPLETED_IMPORT_RECOVERY_SECONDS,\n                max(1, int(result.get("poll_seconds", COMPLETED_IMPORT_RECOVERY_SECONDS))),\n            )\n        except asyncio.CancelledError:\n            raise\n        except Exception:\n            wait_seconds = COMPLETED_IMPORT_RECOVERY_SECONDS\n        await completed_import_signal.wait(wait_seconds)\n'''
          s = s[:match.start()] + new_loop + s[match.end():]

          anchor = 'def client(settings: Settings):\n    return metadata_client(settings)\n\n'
          assert anchor in s
          s = s.replace(anchor, anchor + '\n@app.get("/api/system/runtime-metrics")\ndef runtime_efficiency_metrics():\n    return runtime_metrics.snapshot()\n\n', 1)
          app.write_text(s)

          media = Path('scarletx/media_library.py')
          s = media.read_text()
          s = s.replace('import subprocess\n', 'import subprocess\nimport threading\n', 1)
          anchor = 'from .status_console import emit_status\n'
          assert anchor in s
          s = s.replace(anchor, anchor + 'from .runtime_metrics import runtime_metrics\n', 1)
          anchor = 'GENERATED_ROOT = Path(os.getenv("SCARLETX_GENERATED_DIR", "./generated")).expanduser()\n'
          assert anchor in s
          s = s.replace(anchor, anchor + 'MEDIA_TOOL_CONCURRENCY = max(1, int(os.getenv("SCARLETX_MEDIA_TOOL_CONCURRENCY", "2")))\n_MEDIA_TOOL_SEMAPHORE = threading.BoundedSemaphore(MEDIA_TOOL_CONCURRENCY)\n', 1)
          old = '        return subprocess.run(args, capture_output=True, text=True, check=True, timeout=timeout)\n'
          new = '        with _MEDIA_TOOL_SEMAPHORE, runtime_metrics.media_tool():\n            return subprocess.run(args, capture_output=True, text=True, check=True, timeout=timeout)\n'
          assert old in s
          s = s.replace(old, new, 1)
          old = '                workers = min(4, max(1, (os.cpu_count() or 2) // 2), len(to_index))\n'
          new = '                workers = min(MEDIA_TOOL_CONCURRENCY, len(to_index))\n'
          assert old in s
          s = s.replace(old, new, 1)
          media.write_text(s)

          test = Path('tests/test_background_efficiency.py')
          s = test.read_text()
          s = s.replace('assert "awaitcompleted_import_signal.wait(COMPLETED_IMPORT_RECOVERY_SECONDS)" in compact', 'assert "awaitcompleted_import_signal.wait(wait_seconds)" in compact')
          s = s.replace('assert "COMPLETED_IMPORT_RECOVERY_SECONDS=120" in compact', 'assert "COMPLETED_IMPORT_RECOVERY_SECONDS=120" in compact')
          test.write_text(s)
          PY
      - name: Remove helper workflow and commit patch
        run: |
          rm .github/workflows/apply-event-driven-perf.yml
          git config user.name "TerraLayer"
          git config user.email "321948909+terralayer@users.noreply.github.com"
          git add -A
          git commit -m "perf: make background processing event driven"
          git push origin HEAD:perf/event-driven-background-work
