name: Apply entity hydration endpoint wiring

on:
  push:
    branches: [feat/add-entity-full-hydration]
    paths: [.github/workflows/apply-entity-hydration.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/add-entity-full-hydration
      - name: Wire entity hydration
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scarletx/routes/application.py')
          s = p.read_text()
          old = 'from ..monitored_entities import monitored_entity_discovery_cycle\n'
          new = old + 'from ..entity_hydration import queue_adult_entity_hydration as _queue_adult_entity_hydration\n'
          if new not in s:
              if old not in s:
                  raise SystemExit('import anchor not found')
              s = s.replace(old, new, 1)

          old_performer = '        job_id = _queue_adult_entity_monitor_search(db, tasks, "performer", identifier, settings) if request.monitored else None\n'
          new_performer = '''        job_id = _queue_adult_entity_hydration(\n            db, tasks, "performer", identifier, settings,\n            search_when_monitored=request.monitored,\n        )\n'''
          if old_performer not in s:
              raise SystemExit('performer add anchor not found')
          s = s.replace(old_performer, new_performer, 1)

          old_studio = '        job_id = _queue_adult_entity_monitor_search(db, tasks, "studio", identifier, settings) if request.monitored else None\n'
          new_studio = '''        job_id = _queue_adult_entity_hydration(\n            db, tasks, "studio", identifier, settings,\n            search_when_monitored=request.monitored,\n        )\n'''
          if old_studio not in s:
              raise SystemExit('studio add anchor not found')
          s = s.replace(old_studio, new_studio, 1)
          p.write_text(s)
          PY
          rm .github/workflows/apply-entity-hydration.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scarletx/routes/application.py .github/workflows/apply-entity-hydration.yml
          git commit -m 'feat: hydrate TPDB graph on performer and studio add'
          git push origin HEAD:feat/add-entity-full-hydration
