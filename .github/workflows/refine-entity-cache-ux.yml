name: Refine entity cache UX
on:
  push:
    branches: [fix/entity-cache-pagination-ux]
permissions:
  contents: write
jobs:
  refine:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/entity-cache-pagination-ux
      - name: Refine hydration and styles
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('scarletx/entity_hydration.py')
          s=p.read_text()
          old='''            for start in range(0, len(summaries), DETAIL_BATCH_SIZE):\n                batch = summaries[start:start + DETAIL_BATCH_SIZE]\n                details = await _full_scene_details(tpdb, batch)\n                with SessionLocal() as db:\n'''
          new='''            for start in range(0, len(summaries), DETAIL_BATCH_SIZE):\n                # An Add can be upgraded to Add & Monitor while TPDB hydration is running.\n                effective_search_when_monitored = _job_search_requested(\n                    job_id, effective_search_when_monitored\n                )\n                batch = summaries[start:start + DETAIL_BATCH_SIZE]\n                details = await _full_scene_details(tpdb, batch)\n                with SessionLocal() as db:\n'''
          assert old in s
          s=s.replace(old,new,1)
          old2='''        search_counts: dict[str, int] = {}\n        if effective_search_when_monitored:\n'''
          new2='''        # Re-read once more before searching so a late monitor upgrade is honored.\n        effective_search_when_monitored = _job_search_requested(\n            job_id, effective_search_when_monitored\n        )\n        if effective_search_when_monitored:\n            # Summary-only rows may have been cached before the upgrade. Promote them.\n            with SessionLocal() as db:\n                if summary_ids:\n                    for scene in db.scalars(select(Scene).where(Scene.id.in_(summary_ids))).all():\n                        scene.monitored = True\n                    db.commit()\n\n        search_counts: dict[str, int] = {}\n        if effective_search_when_monitored:\n'''
          assert old2 in s
          s=s.replace(old2,new2,1)
          p.write_text(s)

          p=Path('frontend/ui_overrides.css')
          s=p.read_text()
          needle='.studio-credit{display:flex;align-items:center;gap:10px;min-width:180px}\n'
          assert needle in s
          addition=(needle+
            '.studio-copy{display:flex;flex-direction:column;align-items:flex-start;min-width:0}\n'
            '.studio-release{display:block;margin-top:3px;color:var(--muted,#8f95a3);font-size:12px;line-height:1.2}\n'
            '.dashboard-stat[data-stat-go]{cursor:pointer}\n'
            '.dashboard-stat[data-stat-go]:hover{transform:translateY(-1px)}\n')
          s=s.replace(needle,addition,1)
          p.write_text(s)
          PY
          rm .github/workflows/refine-entity-cache-ux.yml
          git config user.name "TerraLayer"
          git config user.email "321948909+terralayer@users.noreply.github.com"
          git add scarletx/entity_hydration.py frontend/ui_overrides.css .github/workflows/refine-entity-cache-ux.yml
          git commit -m "fix: preserve monitor upgrades during hydration"
          git push origin HEAD:fix/entity-cache-pagination-ux
