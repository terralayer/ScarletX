name: PR7 Apply Green

on:
  push:
    branches:
      - perf/0.3.10-queue-event-stream

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v5
        with:
          ref: perf/0.3.10-queue-event-stream
          fetch-depth: 0

      - name: Apply PR7 integration
        run: python tools/apply_pr7_green.py

      - name: Commit integrated implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/pr7-apply-green.yml tools/apply_pr7_green.py
          git add scarletx/main.py scarletx/status_console.py frontend/index.html frontend/auth.js
          git commit -m "perf: consolidate queue updates on SSE"
          git push origin HEAD:perf/0.3.10-queue-event-stream
