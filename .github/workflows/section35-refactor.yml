name: Section 35 Refactor

on:
  push:
    branches:
      - refactor/35-frontend-decomposition

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: refactor/35-frontend-decomposition
      - name: Extract shared frontend runtime
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path('.')
          app_path = root / 'frontend' / 'app.js'
          app = app_path.read_text(encoding='utf-8')
          lines = app.splitlines()
          drop_prefixes = (
              'const $=',
              'const esc=',
              'const fmtDate=',
              'const bytes=',
              'const durationText=',
              'const api=',
              'const patch=',
              'function notify(',
              'function pageHead(',
              'function empty(',
              'function modal(',
          )
          selected = [line for line in lines if line.startswith(drop_prefixes)]
          expected = 10
          if len(selected) != expected:
              raise SystemExit(f'expected {expected} extractable helper lines, found {len(selected)}')

          runtime = [
              'const $=s=>document.querySelector(s);',
              'const $$=s=>[...document.querySelectorAll(s)];',
          ]
          runtime.extend(line for line in selected if not line.startswith('const $='))
          (root / 'frontend' / 'runtime_core.js').write_text('\n'.join(runtime) + '\n', encoding='utf-8')
          app_path.write_text('\n'.join(line for line in lines if not line.startswith(drop_prefixes)) + '\n', encoding='utf-8')

          index_path = root / 'frontend' / 'index.html'
          index = index_path.read_text(encoding='utf-8')
          app_tag = '<script src="/app.js"></script>'
          runtime_tag = '<script src="/runtime_core.js"></script>'
          if runtime_tag not in index:
              index = index.replace(app_tag, runtime_tag + '\n' + app_tag, 1)
          index_path.write_text(index, encoding='utf-8')

          docker_path = root / 'Dockerfile.web'
          docker = docker_path.read_text(encoding='utf-8')
          copy_app = 'COPY frontend/app.js /usr/share/nginx/html/app.js'
          copy_runtime = 'COPY frontend/runtime_core.js /usr/share/nginx/html/runtime_core.js'
          if copy_runtime not in docker:
              docker = docker.replace(copy_app, copy_runtime + '\n' + copy_app, 1)
          grep_app = "    grep -q '/app.js' /usr/share/nginx/html/index.html; \\\n"
          grep_runtime = "    grep -q '/runtime_core.js' /usr/share/nginx/html/index.html; \\\n"
          if grep_runtime not in docker:
              docker = docker.replace(grep_app, grep_runtime + grep_app, 1)
          docker_path.write_text(docker, encoding='utf-8')

          regression_path = root / 'tests' / 'test_bug_hunt_regressions.py'
          regression = regression_path.read_text(encoding='utf-8')
          old = '''def test_frontend_formats_date_only_values_without_utc_day_shift():
              app = (FRONTEND / "app.js").read_text(encoding="utf-8")
              fmt = app[app.index("const fmtDate="):app.index("const bytes=")]
          '''
          new = '''def test_frontend_formats_date_only_values_without_utc_day_shift():
              runtime = (FRONTEND / "runtime_core.js").read_text(encoding="utf-8")
              fmt = runtime[runtime.index("const fmtDate="):runtime.index("const bytes=")]
          '''
          if old not in regression:
              raise SystemExit('date formatting regression test source did not match expected text')
          regression_path.write_text(regression.replace(old, new, 1), encoding='utf-8')
          PY

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/section35-refactor.yml
          git add frontend/app.js frontend/runtime_core.js frontend/index.html Dockerfile.web tests/test_bug_hunt_regressions.py
          git commit -m "refactor: extract shared frontend runtime helpers"
          git push origin HEAD:refactor/35-frontend-decomposition
