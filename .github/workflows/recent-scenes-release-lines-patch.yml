name: Recent Scenes Release Lines Patch

on:
  push:
    branches:
      - fix/dashboard-release-lines

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/dashboard-release-lines
      - name: Patch dashboard recent scene release layout
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          app_path = Path('frontend/app.js')
          source = app_path.read_text(encoding='utf-8')

          old_call = "sceneTable(scenes,true)"
          if source.count(old_call) != 1:
              raise SystemExit(f'expected one dashboard sceneTable call, found {source.count(old_call)}')
          source = source.replace(old_call, "sceneTable(scenes,true,true)", 1)

          studio_start = source.index("function studioLink(")
          rows_start = source.index("function sceneRowsHtml", studio_start)
          table_start = source.index("function sceneTable", rows_start)
          bind_start = source.index("function bindSceneTableActions", table_start)

          studio_fn = '''function studioLink(x,includeDate=true){let st=x.studio,date=includeDate?`<small class="studio-release">${fmtDate(x.release_date)}</small>`:'';if(!st)return `<span class="studio-credit"><span class="muted">—</span>${date}</span>`;let name=typeof st==='string'?st:(st.name||'Studio'),id=typeof st==='object'?(st.id||st.tpdb_id||''):(x.studio_id||'');let logo=id?`<span class="studio-logo"><img src="/api/artwork/studios/${encodeURIComponent(id)}?v=v5" alt="" loading="lazy" onerror="this.closest('.studio-logo').remove()"></span>`:'';return `<span class="studio-credit">${logo}<span class="studio-copy">${id?`<button class="studio-link" data-studio-link="${esc(id)}">${esc(name)}</button>`:esc(name)}${date}</span></span>`}\n'''

          rows_fn = '''function sceneRowsHtml(rows,inLibrary=false,releaseDateUnderScene=false){return rows.map(x=>{let id=x.tpdb_id||x.id,local=inLibrary?x.id:(x.local_id||''),mediaId=x.media_id||(x.files||[])[0]?.id||'',hasFile=!!mediaId||inLibrary&&(x.has_file||(x.files||[]).length>0),art=sceneImage(x)?`/api/artwork/scenes/${encodeURIComponent(id)}?size=card`:'';let sceneCopy=releaseDateUnderScene?`<div class="dashboard-scene-copy"><button class="scene-title" data-scene-detail>${esc(x.title||'Untitled')}</button><div class="dashboard-release-date">${fmtDate(x.release_date)}</div></div>`:`<button class="scene-title" data-scene-detail>${esc(x.title||'Untitled')}</button>`;return `<tr data-scene-id="${esc(id)}" data-local-id="${esc(local)}"><td><div class="scene-credit"><button class="scene-thumb" data-scene-detail aria-label="Open ${esc(x.title||'scene')}">${art?`<img src="${esc(art)}" alt="" loading="lazy" onerror="this.remove()">`:''}<span>▶</span></button>${sceneCopy}</div></td><td>${studioLink(x,!releaseDateUnderScene)}</td><td>${performerLinks(x)}</td><td><div class="scene-status">${inLibrary?`<span class="state ${x.monitored?'good':'warn'}">${x.monitored?'Monitored':'Not monitored'}</span>${hasFile?'<span class="state good">Downloaded</span>':''}`:`<span class="state ${['Downloaded','Downloading','Queued','Post-processing','Import pending'].includes(x.download_status)?'good':x.download_status==='Failed'?'bad':'warn'}">${esc(x.download_status||'Available')}</span>`}</div></td><td><div class="actions"><button class="btn small primary" data-play-scene="${esc(mediaId)}" ${mediaId?'':'disabled title="Not downloaded"'}>▶ Play</button>${(!inLibrary||!x.monitored)?'<button class="btn small primary" data-monitor-scene>Monitor</button>':''}${inLibrary?'<button class="btn small danger" data-remove-scene>Remove</button>':'<button class="btn small" data-scene-detail>Details</button>'}</div></td></tr>`}).join('')}\n'''

          table_fn = '''function sceneTable(rows,inLibrary=false,releaseDateUnderScene=false){if(!rows.length)return empty('No scenes found.');return `<div class="tablewrap"><table class="table"><thead><tr><th>Scene</th><th>Studio</th><th>Performers</th><th>Status</th><th></th></tr></thead><tbody>${sceneRowsHtml(rows,inLibrary,releaseDateUnderScene)}</tbody></table></div>`}\n'''

          source = source[:studio_start] + studio_fn + rows_fn + table_fn + source[bind_start:]
          app_path.write_text(source, encoding='utf-8')

          hotfix_path = Path('frontend/dashboard_regression_hotfix.js')
          hotfix = hotfix_path.read_text(encoding='utf-8')
          old = '''  sceneTable = function(rows, inLibrary = false) {\n    if (!rows.length) return empty('No scenes found.');\n    return `<div class="tablewrap"><table class="table"><thead><tr><th>Scene</th><th>Studio</th><th>Performers</th><th>Status</th><th></th></tr></thead><tbody>${sceneRowsHtml(rows,inLibrary)}</tbody></table></div>`;\n  };'''
          new = '''  sceneTable = function(rows, inLibrary = false, releaseDateUnderScene = false) {\n    if (!rows.length) return empty('No scenes found.');\n    return `<div class="tablewrap"><table class="table"><thead><tr><th>Scene</th><th>Studio</th><th>Performers</th><th>Status</th><th></th></tr></thead><tbody>${releaseDateUnderScene ? sceneRowsHtml(rows,inLibrary,true) : sceneRowsHtml(rows,inLibrary)}</tbody></table></div>`;\n  };'''
          if hotfix.count(old) != 1:
              raise SystemExit(f'expected one dashboard sceneTable hotfix, found {hotfix.count(old)}')
          hotfix_path.write_text(hotfix.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Verify focused regressions
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check --editable '.[dev]'
          python -m pytest \
            tests/test_dashboard_release_line_layout.py \
            tests/test_dashboard_regression_hotfix.py::test_dashboard_scene_table_restores_performers_column \
            -q
      - name: Commit patch and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "TerraLayer"
          git config user.email "321948909+terralayer@users.noreply.github.com"
          git rm .github/workflows/recent-scenes-release-lines-patch.yml
          git add frontend/app.js frontend/dashboard_regression_hotfix.js
          git commit -m "Split recent scene title and release date lines"
          git push origin HEAD:fix/dashboard-release-lines
