name: PR10 Packaging A-B Comparison

on:
  pull_request:
    branches: [release/0.3.10]
  workflow_dispatch:

permissions:
  contents: read

env:
  BASE_REF: 34d7c27b44a8c4591eff313feee4fc209c4ec6cd

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out candidate with history
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Materialize PR9 baseline
        run: git worktree add "$RUNNER_TEMP/pr9-base" "$BASE_REF"

      - name: Build baseline and candidate images
        run: |
          docker build --file "$RUNNER_TEMP/pr9-base/Dockerfile" --tag scarletx-backend:pr9 "$RUNNER_TEMP/pr9-base"
          docker build --file Dockerfile --tag scarletx-backend:pr10 .
          docker build --file "$RUNNER_TEMP/pr9-base/Dockerfile.web" --tag scarletx-web:pr9 "$RUNNER_TEMP/pr9-base"
          docker build --file Dockerfile.web --tag scarletx-web:pr10 .

      - name: Record exact image sizes
        shell: bash
        run: |
          set -euo pipefail
          for image in scarletx-backend:pr9 scarletx-backend:pr10 scarletx-web:pr9 scarletx-web:pr10; do
            key=$(echo "$image" | tr ':-' '__' | tr '[:lower:]' '[:upper:]')
            bytes=$(docker image inspect "$image" --format '{{.Size}}')
            gzip_bytes=$(docker save "$image" | gzip -1 | wc -c | tr -d ' ')
            echo "${key}_BYTES=$bytes" | tee -a "$GITHUB_ENV"
            echo "${key}_GZIP_BYTES=$gzip_bytes" | tee -a "$GITHUB_ENV"
          done

      - name: Compare seven alternating backend cold starts
        shell: bash
        run: |
          set -euo pipefail
          results="$RUNNER_TEMP/backend-cold-start.tsv"
          : > "$results"

          measure() {
            local label="$1" image="$2" port="$3"
            local name="scarletx-ab-${label}-${RANDOM}"
            local start_ns ready_ns elapsed
            start_ns=$(date +%s%N)
            docker run -d --name "$name" \
              --tmpfs /config:uid=568,gid=568 \
              --tmpfs /downloads:uid=568,gid=568 \
              --tmpfs /media:uid=568,gid=568 \
              --tmpfs /backups:uid=568,gid=568 \
              -p "${port}:8000" "$image" >/dev/null
            for _ in $(seq 1 1500); do
              if curl --fail --silent "http://127.0.0.1:${port}/api/health" >/dev/null; then
                ready_ns=$(date +%s%N)
                elapsed=$(( (ready_ns - start_ns) / 1000000 ))
                printf '%s\t%s\n' "$label" "$elapsed" | tee -a "$results"
                docker rm -f "$name" >/dev/null
                return 0
              fi
              sleep 0.02
            done
            docker logs "$name" || true
            docker rm -f "$name" >/dev/null || true
            return 1
          }

          measure warm-pr9 scarletx-backend:pr9 18100 >/dev/null
          measure warm-pr10 scarletx-backend:pr10 18101 >/dev/null
          : > "$results"

          for i in $(seq 1 7); do
            if (( i % 2 == 1 )); then
              measure pr9 scarletx-backend:pr9 18100
              measure pr10 scarletx-backend:pr10 18101
            else
              measure pr10 scarletx-backend:pr10 18101
              measure pr9 scarletx-backend:pr9 18100
            fi
          done

          python - "$results" <<'PY'
          import os, statistics, sys
          from pathlib import Path
          values = {"pr9": [], "pr10": []}
          for line in Path(sys.argv[1]).read_text().splitlines():
              label, value = line.split("\t")
              values[label].append(int(value))
          base = statistics.median(values["pr9"])
          candidate = statistics.median(values["pr10"])
          delta = candidate - base
          pct = (delta / base * 100.0) if base else 0.0
          for label in ("pr9", "pr10"):
              vals = values[label]
              print(f"{label.upper()}_BACKEND_COLD_START_SAMPLES_MS={','.join(map(str, vals))}")
          print(f"PR9_BACKEND_COLD_START_MEDIAN_MS={base:.1f}")
          print(f"PR10_BACKEND_COLD_START_MEDIAN_MS={candidate:.1f}")
          print(f"BACKEND_COLD_START_DELTA_MS={delta:.1f}")
          print(f"BACKEND_COLD_START_DELTA_PCT={pct:.2f}")
          with open(os.environ['GITHUB_ENV'], 'a') as out:
              out.write(f"PR9_BACKEND_COLD_START_MEDIAN_MS={base:.1f}\n")
              out.write(f"PR10_BACKEND_COLD_START_MEDIAN_MS={candidate:.1f}\n")
              out.write(f"BACKEND_COLD_START_DELTA_MS={delta:.1f}\n")
              out.write(f"BACKEND_COLD_START_DELTA_PCT={pct:.2f}\n")
          if candidate > base * 1.20:
              raise SystemExit(f"PR10 backend cold start regressed more than 20%: {candidate}ms vs {base}ms")
          PY

      - name: Compare web cold starts and idle cgroup memory
        shell: bash
        run: |
          set -euo pipefail
          pr9_net=scarletx-ab-pr9
          pr10_net=scarletx-ab-pr10
          docker network create "$pr9_net" >/dev/null
          docker network create "$pr10_net" >/dev/null
          cleanup() {
            docker rm -f pr9-web-idle pr10-web-idle pr9-backend-idle pr10-backend-idle >/dev/null 2>&1 || true
            docker ps -aq --filter 'name=scarletx-web-ab-' | xargs -r docker rm -f >/dev/null 2>&1 || true
            docker network rm "$pr9_net" "$pr10_net" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          start_backend() {
            local image="$1" network="$2" name="$3"
            docker run -d --name "$name" --network "$network" --network-alias scarletx-backend \
              --tmpfs /config:uid=568,gid=568 \
              --tmpfs /downloads:uid=568,gid=568 \
              --tmpfs /media:uid=568,gid=568 \
              --tmpfs /backups:uid=568,gid=568 \
              "$image" >/dev/null
            for _ in $(seq 1 1500); do
              if docker exec "$name" python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=1).read()" >/dev/null 2>&1; then
                return 0
              fi
              sleep 0.02
            done
            docker logs "$name" || true
            return 1
          }

          start_backend scarletx-backend:pr9 "$pr9_net" pr9-backend-idle
          start_backend scarletx-backend:pr10 "$pr10_net" pr10-backend-idle

          results="$RUNNER_TEMP/web-cold-start.tsv"
          : > "$results"
          measure_web() {
            local label="$1" image="$2" network="$3" port="$4"
            local name="scarletx-web-ab-${label}-${RANDOM}"
            local start_ns ready_ns elapsed
            start_ns=$(date +%s%N)
            docker run -d --name "$name" --network "$network" -p "${port}:8690" "$image" >/dev/null
            for _ in $(seq 1 1000); do
              if curl --fail --silent "http://127.0.0.1:${port}/api/health" >/dev/null; then
                ready_ns=$(date +%s%N)
                elapsed=$(( (ready_ns - start_ns) / 1000000 ))
                printf '%s\t%s\n' "$label" "$elapsed" | tee -a "$results"
                docker rm -f "$name" >/dev/null
                return 0
              fi
              sleep 0.02
            done
            docker logs "$name" || true
            docker rm -f "$name" >/dev/null || true
            return 1
          }

          measure_web warm-pr9 scarletx-web:pr9 "$pr9_net" 18690 >/dev/null
          measure_web warm-pr10 scarletx-web:pr10 "$pr10_net" 18691 >/dev/null
          : > "$results"
          for i in $(seq 1 7); do
            if (( i % 2 == 1 )); then
              measure_web pr9 scarletx-web:pr9 "$pr9_net" 18690
              measure_web pr10 scarletx-web:pr10 "$pr10_net" 18691
            else
              measure_web pr10 scarletx-web:pr10 "$pr10_net" 18691
              measure_web pr9 scarletx-web:pr9 "$pr9_net" 18690
            fi
          done

          docker run -d --name pr9-web-idle --network "$pr9_net" scarletx-web:pr9 >/dev/null
          docker run -d --name pr10-web-idle --network "$pr10_net" scarletx-web:pr10 >/dev/null
          for name in pr9-web-idle pr10-web-idle; do
            for _ in $(seq 1 1000); do
              if docker exec "$name" wget -q -O /dev/null http://127.0.0.1:8690/api/health >/dev/null 2>&1; then break; fi
              sleep 0.02
            done
          done
          sleep 5
          pr9_backend_mem=$(docker exec pr9-backend-idle cat /sys/fs/cgroup/memory.current)
          pr10_backend_mem=$(docker exec pr10-backend-idle cat /sys/fs/cgroup/memory.current)
          pr9_web_mem=$(docker exec pr9-web-idle cat /sys/fs/cgroup/memory.current)
          pr10_web_mem=$(docker exec pr10-web-idle cat /sys/fs/cgroup/memory.current)

          python - "$results" "$pr9_backend_mem" "$pr10_backend_mem" "$pr9_web_mem" "$pr10_web_mem" <<'PY'
          import os, statistics, sys
          from pathlib import Path
          values = {"pr9": [], "pr10": []}
          for line in Path(sys.argv[1]).read_text().splitlines():
              label, value = line.split("\t")
              values[label].append(int(value))
          base = statistics.median(values["pr9"])
          candidate = statistics.median(values["pr10"])
          delta = candidate - base
          pct = (delta / base * 100.0) if base else 0.0
          mem = {
              "PR9_BACKEND_IDLE_BYTES": int(sys.argv[2]),
              "PR10_BACKEND_IDLE_BYTES": int(sys.argv[3]),
              "PR9_WEB_IDLE_BYTES": int(sys.argv[4]),
              "PR10_WEB_IDLE_BYTES": int(sys.argv[5]),
          }
          print(f"PR9_WEB_COLD_START_SAMPLES_MS={','.join(map(str, values['pr9']))}")
          print(f"PR10_WEB_COLD_START_SAMPLES_MS={','.join(map(str, values['pr10']))}")
          print(f"PR9_WEB_COLD_START_MEDIAN_MS={base:.1f}")
          print(f"PR10_WEB_COLD_START_MEDIAN_MS={candidate:.1f}")
          print(f"WEB_COLD_START_DELTA_MS={delta:.1f}")
          print(f"WEB_COLD_START_DELTA_PCT={pct:.2f}")
          for key, value in mem.items():
              print(f"{key}={value}")
          with open(os.environ['GITHUB_ENV'], 'a') as out:
              out.write(f"PR9_WEB_COLD_START_MEDIAN_MS={base:.1f}\n")
              out.write(f"PR10_WEB_COLD_START_MEDIAN_MS={candidate:.1f}\n")
              out.write(f"WEB_COLD_START_DELTA_MS={delta:.1f}\n")
              out.write(f"WEB_COLD_START_DELTA_PCT={pct:.2f}\n")
              for key, value in mem.items():
                  out.write(f"{key}={value}\n")
          if candidate > base * 1.20:
              raise SystemExit(f"PR10 web cold start regressed more than 20%: {candidate}ms vs {base}ms")
          if mem["PR10_BACKEND_IDLE_BYTES"] > mem["PR9_BACKEND_IDLE_BYTES"] * 1.25:
              raise SystemExit("PR10 backend idle memory regressed more than 25%")
          if mem["PR10_WEB_IDLE_BYTES"] > mem["PR9_WEB_IDLE_BYTES"] * 1.25:
              raise SystemExit("PR10 web idle memory regressed more than 25%")
          PY

      - name: Summarize A-B result
        run: |
          {
            echo '### PR10 same-run packaging comparison'
            echo '| Metric | PR9 baseline | PR10 candidate |'
            echo '| --- | ---: | ---: |'
            echo "| Backend image bytes | $SCARLETX_BACKEND_PR9_BYTES | $SCARLETX_BACKEND_PR10_BYTES |"
            echo "| Backend gzip bytes | $SCARLETX_BACKEND_PR9_GZIP_BYTES | $SCARLETX_BACKEND_PR10_GZIP_BYTES |"
            echo "| Web image bytes | $SCARLETX_WEB_PR9_BYTES | $SCARLETX_WEB_PR10_BYTES |"
            echo "| Web gzip bytes | $SCARLETX_WEB_PR9_GZIP_BYTES | $SCARLETX_WEB_PR10_GZIP_BYTES |"
            echo "| Backend cold-start median ms | $PR9_BACKEND_COLD_START_MEDIAN_MS | $PR10_BACKEND_COLD_START_MEDIAN_MS |"
            echo "| Web cold-start median ms | $PR9_WEB_COLD_START_MEDIAN_MS | $PR10_WEB_COLD_START_MEDIAN_MS |"
            echo "| Backend idle cgroup bytes | $PR9_BACKEND_IDLE_BYTES | $PR10_BACKEND_IDLE_BYTES |"
            echo "| Web idle cgroup bytes | $PR9_WEB_IDLE_BYTES | $PR10_WEB_IDLE_BYTES |"
            echo
            echo "Backend cold-start delta: ${BACKEND_COLD_START_DELTA_MS} ms (${BACKEND_COLD_START_DELTA_PCT}%)."
            echo "Web cold-start delta: ${WEB_COLD_START_DELTA_MS} ms (${WEB_COLD_START_DELTA_PCT}%)."
          } >> "$GITHUB_STEP_SUMMARY"
