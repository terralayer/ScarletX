name: Capture README screenshots

on:
  push:
    branches: [readme-refresh]
    paths:
      - .github/workflows/capture-readme-screens.yml

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Render README screens
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          src = Path('scarletx/web/index.html').read_text(encoding='utf-8')
          base = re.sub(r'<script>.*?</script>', '', src, flags=re.S)
          base = base.replace('<small id="versionSide">Local</small>', '<small id="versionSide">v0.3.6</small>')

          def empty(message):
              return f'<div class="empty">{message}</div>'

          dashboard = '''
          <div class="pagehead"><div><h1>Welcome back</h1><p>Here’s what’s happening with your library.</p></div><div class="actions"><button class="btn primary">＋ Add New</button></div></div>
          <div class="stats">
          <div class="stat"><div class="stat-icon">▣</div><div><small>Scenes</small><strong>0</strong><em>Adult library</em></div></div>
          <div class="stat"><div class="stat-icon">♙</div><div><small>Performers</small><strong>0</strong><em>In library</em></div></div>
          <div class="stat"><div class="stat-icon">▥</div><div><small>Studios</small><strong>0</strong><em>In library</em></div></div>
          <div class="stat"><div class="stat-icon">◎</div><div><small>Wanted</small><strong>0</strong><em>Missing</em></div></div>
          <div class="stat"><div class="stat-icon">▱</div><div><small>Storage</small><strong>—</strong><em>No scene root yet</em></div></div>
          </div>
          <div class="dashgrid">
          <div class="panel"><div class="panel-head"><h2>Activity Queue</h2><button class="linkbtn">View all</button></div><div class="rows">''' + empty('No active jobs.') + '''</div></div>
          <div class="panel"><div class="panel-head"><h2>Recent Activity</h2><button class="linkbtn">View all</button></div><div class="rows">''' + empty('No history yet.') + '''</div></div>
          <div class="panel"><div class="panel-head"><h2>Upcoming</h2><button class="linkbtn">View calendar</button></div><div class="rows">''' + empty('No upcoming monitored releases.') + '''</div></div>
          </div>
          <div class="panel recent"><div class="panel-head"><h2>Recently Added Scenes</h2><button class="linkbtn">View library</button></div><div style="padding:0 12px 14px">''' + empty('Add your first scene to start building the library.') + '''</div></div>
          '''

          scenes = '''
          <div class="pagehead"><div><h1>Scenes</h1></div></div>
          <div class="toolbar"><div class="tabs"><button class="active">Library</button><button>Add / Search</button></div><form class="searchbox"><input class="input" placeholder="Search scenes…"></form><button class="btn">Refresh Library</button></div>
          <div id="entityNotice"></div><div id="entityGrid">''' + empty('No scenes found.') + '''</div>
          '''

          def render(content, active):
              page = base.replace('<section class="content" id="app"></section>', f'<section class="content" id="app">{content}</section>')
              page = re.sub(r'<button class="active" data-view="dashboard">', '<button data-view="dashboard">', page)
              page = page.replace(f'<button data-view="{active}">', f'<button class="active" data-view="{active}">')
              return page

          Path('/tmp/scarletx-dashboard.html').write_text(render(dashboard, 'dashboard'), encoding='utf-8')
          Path('/tmp/scarletx-scenes.html').write_text(render(scenes, 'scenes'), encoding='utf-8')
          PY

          mkdir -p docs/images
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME"
          "$CHROME" --headless --disable-gpu --no-sandbox --hide-scrollbars --window-size=1440,900 --screenshot="$PWD/docs/images/scarletx-dashboard.png" file:///tmp/scarletx-dashboard.html
          "$CHROME" --headless --disable-gpu --no-sandbox --hide-scrollbars --window-size=1440,900 --screenshot="$PWD/docs/images/scarletx-scenes.png" file:///tmp/scarletx-scenes.html

      - name: Validate screenshots
        run: |
          python - <<'PY'
          from pathlib import Path
          import struct
          for name in ('docs/images/scarletx-dashboard.png', 'docs/images/scarletx-scenes.png'):
              data = Path(name).read_bytes()
              assert data[:8] == b'\x89PNG\r\n\x1a\n', name
              width, height = struct.unpack('>II', data[16:24])
              assert (width, height) == (1440, 900), (name, width, height)
              assert len(data) > 20000, (name, len(data))
              print(name, width, height, len(data))
          PY

      - name: Commit screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/images/scarletx-dashboard.png docs/images/scarletx-scenes.png
          git diff --cached --quiet && exit 0
          git commit -m "Add ScarletX README screenshots"
          git push
