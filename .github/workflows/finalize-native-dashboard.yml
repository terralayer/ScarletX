name: Finalize native dashboard source

on:
  push:
    branches: [fix/native-dashboard-040]

permissions:
  contents: write

jobs:
  rewrite:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/native-dashboard-040
          fetch-depth: 0

      - name: Replace legacy dashboard in core runtime
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          app_path = Path('frontend/app.js')
          text = app_path.read_text(encoding='utf-8')
          start = text.index('async function dashboard(){')
          end = text.index('function performerLinks', start)

          replacement = r'''const dashboardIcons={
            performers:'<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="7" r="4"/><path d="M4.5 21a7.5 7.5 0 0 1 15 0"/></svg>',
            scenes:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 8h18v12H3z"/><path d="m5 8 2-4h4l-2 4m4 0 2-4h4l-2 4"/><path d="m10 12 5 3-5 3z"/></svg>',
            studios:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 21h18M5 21V8l7-5 7 5v13M9 10h2m2 0h2M9 14h2m2 0h2M11 21v-4h2v4"/></svg>',
            calendar:'<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4m8-4v4M3 10h18"/></svg>',
            downloads:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m-5-5 5 5 5-5M4 20h16"/></svg>'
          };
          function dashboardStat(icon,label,value,detail,target){return `<button type="button" class="stat dashboard-stat" data-stat-go="${target}"><div class="stat-icon">${icon}</div><div><small>${label}</small><strong>${value}</strong><em>${detail}</em></div></button>`}
          function dashboardStudioName(scene){if(!scene?.studio)return'Unknown studio';return typeof scene.studio==='string'?scene.studio:(scene.studio.name||'Unknown studio')}
          function dashboardRecentRows(scenes){
            if(!scenes.length)return empty('No downloaded scenes yet.');
            return `<div class="approved-recent-list">${scenes.slice(0,5).map((scene,index)=>{let tpdbId=scene.tpdb_id||scene.id,localId=scene.id||'',title=scene.title||'Untitled',art=sceneImage(scene)?`/api/artwork/scenes/${encodeURIComponent(tpdbId)}?size=card`:'';return `<div class="approved-recent-row" data-dashboard-scene="${esc(localId)}"><button type="button" class="approved-recent-thumb" data-dashboard-scene="${esc(localId)}" aria-label="Open ${esc(title)}">${art?`<img src="${esc(art)}" alt="" loading="lazy" onerror="this.remove()">`:''}</button><div class="approved-recent-copy"><button type="button" class="approved-recent-title" data-dashboard-scene="${esc(localId)}">${esc(title)}</button><div class="approved-recent-meta">${esc(dashboardStudioName(scene))}</div></div><div class="approved-recent-date">${fmtDate(scene.release_date)}${index<2?'<span class="approved-new-badge">NEW</span>':''}</div></div>`}).join('')}</div>`
          }
          function dashboardUpcomingRows(rows){
            if(!rows.length)return `<div class="row"><div class="rowicon">—</div><div><b>No upcoming releases</b><small>Monitored release dates will appear here.</small></div></div>`;
            return rows.slice(0,5).map(item=>{let day=String(item.date||'').slice(8,10).replace(/^0/,'')||'—';return `<div class="row"><div class="rowicon">${esc(day)}</div><div><b>${esc(item.title||'Upcoming scene')}</b><small>${fmtDate(item.date)}</small></div><span class="badge soft">Scene</span></div>`}).join('')
          }
          async function dashboard(){
            const app=$('#app');
            app.innerHTML=`<section class="dashboard-hero"><div class="dashboard-hero-copy"><h1>Welcome to <span>ScarletX</span></h1><p>Discover. Monitor. Organize. Enjoy.</p></div></section><div class="stats approved-stat-grid" id="stats">${dashboardStat(dashboardIcons.performers,'Performers','—','Monitored performers','performers')}${dashboardStat(dashboardIcons.scenes,'Scenes','—','In your library','library')}${dashboardStat(dashboardIcons.studios,'Studios','—','Tracked studios','studios')}${dashboardStat(dashboardIcons.calendar,'Upcoming','—','Scenes this month','calendar')}${dashboardStat(dashboardIcons.downloads,'Downloads','—','In progress','activity')}</div><div class="approved-dashboard-grid"><section class="panel recent"><div class="panel-head"><h2>Recent Scenes</h2><button class="linkbtn" type="button" data-go="library">View All</button></div><div id="recentScenes"></div></section><section class="panel approved-upcoming"><div class="panel-head"><h2>Upcoming Releases</h2><button class="linkbtn" type="button" data-go="calendar">View Calendar</button></div><div class="rows" id="calendarRows"></div></section></div>`;
            bindDashboardStats();
            app.onclick=e=>{let scene=e.target.closest('[data-dashboard-scene]');if(scene){let localId=Number(scene.dataset.dashboardScene||0);if(localId)openLocalScene(localId);return}let b=e.target.closest('[data-go]');if(!b)return;let target=b.dataset.go;if(['scenes','performers','studios'].includes(target))entityMode[target]='library';view=target;nav();render()};
            try{
              let [sys,recent,cal,queue]=await Promise.all([api('/api/system/status'),api('/api/dashboard/scenes?limit=8'),api('/api/calendar?limit=5'),api('/api/activity/queue').catch(()=>({tracked:[]}))]);
              if(view!=='dashboard')return;
              let scenes=recent.items||[],calendar=cal||[],downloads=(queue.tracked||[]).length;libraryCache=scenes;
              $('#stats').innerHTML=[dashboardStat(dashboardIcons.performers,'Performers',sys.performers||0,'Monitored performers','performers'),dashboardStat(dashboardIcons.scenes,'Scenes',recent.total||0,'In your library','library'),dashboardStat(dashboardIcons.studios,'Studios',sys.studios||0,'Tracked studios','studios'),dashboardStat(dashboardIcons.calendar,'Upcoming',calendar.length,'Scenes this month','calendar'),dashboardStat(dashboardIcons.downloads,'Downloads',downloads,'In progress','activity')].join('');
              bindDashboardStats();
              $('#recentScenes').innerHTML=dashboardRecentRows(scenes);
              $('#calendarRows').innerHTML=dashboardUpcomingRows(calendar);
              $('#queueBadge').textContent=downloads;
            }catch(err){if(view!=='dashboard')return;notify(err.message,'error')}
          }
          '''

          app_path.write_text(text[:start] + replacement + text[end:], encoding='utf-8')

          index_path = Path('frontend/index.html')
          index = index_path.read_text(encoding='utf-8').replace('<script src="/dashboard_v2.js"></script>\n', '')
          index_path.write_text(index, encoding='utf-8')

          docker_path = Path('Dockerfile.web')
          docker = docker_path.read_text(encoding='utf-8')
          docker = docker.replace('COPY frontend/dashboard_v2.js /usr/share/nginx/html/dashboard_v2.js\n', '')
          docker = docker.replace("    grep -q '/dashboard_v2.js' /usr/share/nginx/html/index.html; \\\n", '')
          docker_path.write_text(docker, encoding='utf-8')
          PY

          git rm frontend/dashboard_v2.js

      - name: Commit native dashboard source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/app.js frontend/index.html Dockerfile.web frontend/dashboard_v2.js
          git commit -m "fix: make approved dashboard the core renderer"
          git push origin HEAD:fix/native-dashboard-040
