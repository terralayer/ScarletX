name: Apply 0.3.9 hardening

on:
  push:
    branches: [hardening-0.3.9]
    paths:
      - tools/apply_039_hardening.py
      - .github/workflows/apply-039-hardening.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out hardening branch
        uses: actions/checkout@v5
        with:
          ref: hardening-0.3.9
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Apply hardening transformation
        run: python tools/apply_039_hardening.py

      - name: Install project and test dependencies
        run: python -m pip install --disable-pip-version-check --editable '.[dev]'

      - name: Run full test suite
        run: python -m pytest -q

      - name: Verify source compilation
        run: python -m compileall -q scarletx tests tools

      - name: Commit verified implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No implementation changes produced" >&2; exit 1; }
          git commit -m "Harden ScarletX security and performance"
          git push origin HEAD:hardening-0.3.9
