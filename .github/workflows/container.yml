name: Sidebar Icons 0.4.1

on:
  push:
    branches: ["fix/sidebar-icons-0.4.1"]
  workflow_dispatch:

concurrency:
  group: sidebar-icons-041-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build-web:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependency
        run: python -m pip install 'pytest>=8,<9'

      - name: Verify header UI contract
        run: python -m pytest -q tests/test_header_icons_041.py

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push icon-only web image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.web
          push: true
          platforms: linux/amd64
          tags: ghcr.io/terralayer/scarletx-web:0.4.1-icons-header-level
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
