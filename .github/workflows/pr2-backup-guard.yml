name: PR 2 backup guard wiring

on:
  push:
    branches:
      - perf/0.3.10-query-paths
    paths:
      - tools/pr2-backup-guard.trigger

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: perf/0.3.10-query-paths
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Apply startup backup guard
        run: python tools/patch_pr2_backup_guard.py
      - name: Commit startup wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scarletx/main.py
          git diff --cached --check
          git commit -m "fix: back up database before PR 2 index migration"
          git push origin HEAD:perf/0.3.10-query-paths
