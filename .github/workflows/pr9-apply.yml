# PR9 behavior-preserving decomposition runner
name: PR9 Apply Decomposition

on:
  push:
    branches: [refactor/0.3.10-module-boundaries]

permissions:
  contents: write

jobs:
  decompose:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v5
        with:
          ref: refactor/0.3.10-module-boundaries
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Preserve path-sensitive legacy web reference
        run: python .github/scripts/pr9_prepare_relocation.py
      - name: Apply decomposition
        run: python .github/scripts/pr9_decompose.py
      - name: Preserve route and extracted-asset contracts
        run: python .github/scripts/pr9_fix_boundaries.py
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check --editable '.[dev]'
      - name: Verify behavior-preserving boundaries
        run: |
          python -m pytest tests/test_module_boundaries.py tests/test_auth_ui.py tests/test_ui_theme.py tests/test_nginx_boundary.py -q
          python -m ruff check scarletx tests tools
          python -m compileall -q scarletx tests tools
      - name: Commit decomposition
        run: |
          rm .github/workflows/pr9-apply.yml
          rm .github/scripts/pr9_decompose.py
          rm .github/scripts/pr9_prepare_relocation.py
          rm .github/scripts/pr9_fix_boundaries.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor: split backend and frontend modules'
          git push origin HEAD:refactor/0.3.10-module-boundaries
