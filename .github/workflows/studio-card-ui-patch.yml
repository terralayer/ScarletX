name: Studio Card UI Patch

on:
  push:
    branches:
      - feature/studio-scene-counts

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/studio-scene-counts
      - name: Patch authoritative studio card renderer and styles
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          app_path = Path("frontend/app.js")
          app = app_path.read_text(encoding="utf-8")
          pattern = re.compile(
              r"function entityCard\(type,x,inLibrary\)\{\n.*?\n\}\nfunction bindEntityActions",
              re.S,
          )
          replacement = '''function entityCard(type,x,inLibrary){
            let id=x.tpdb_id||x.id, img=x.image_url||x.poster_url||x.logo_url||'', title=x.title||x.name||'Untitled',sub=x.aliases||x.description||'';
            let posterClass=type==='performers'?'media-poster performer-poster':'media-poster';
            let cachedImg=type==='performers'?`/api/artwork/performers/${encodeURIComponent(id)}?size=card`:type==='studios'?`/api/artwork/studios/${encodeURIComponent(id)}?v=v5`:img;
            let renderImg=type==='studios'||!!img;
            let actions=inLibrary?`<button class="btn small" data-detail>Details</button>`:`<button class="btn small" data-add-only>Add</button><button class="btn small primary" data-add-monitor>Add & Monitor</button><button class="btn small" data-remote-detail>Details</button>`;
            let footer=type==='studios'&&inLibrary?`<div class="studio-card-footer"><div class="actions">${actions}</div><span class="studio-scene-count" title="Downloaded / total scenes">${Number(x.downloaded_scene_count||0)} / ${Number(x.scene_count||0)} scenes</span></div>`:`<div class="actions">${actions}</div>`;
            return `<article class="media-card ${type==='performers'?'performer-card':type==='studios'?'studio-card':''}" data-id="${esc(id)}" data-local-id="${inLibrary?esc(x.id):''}"><div class="${posterClass}">${renderImg?`<img src="${esc(cachedImg)}" loading="lazy" ${type==='performers'?'data-performer-image title="Open performer profile"':''} onerror="this.remove()">`:''}</div><div class="media-body"><h3>${esc(title)}</h3><p>${esc(typeof sub==='string'?sub:'')}</p>${footer}</div></article>`
          }
          function bindEntityActions'''
          updated, count = pattern.subn(replacement, app, count=1)
          if count != 1:
              raise SystemExit(f"expected one entityCard replacement, found {count}")
          app_path.write_text(updated, encoding="utf-8")

          css_path = Path("frontend/ui_overrides.css")
          css = css_path.read_text(encoding="utf-8")
          marker = ".studio-card-footer{"
          if marker not in css:
              css += '''\n.studio-card-footer{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:auto}\n.studio-card-footer .actions{margin:0}\n.studio-scene-count{margin-left:auto;text-align:right;color:var(--muted,#8f95a3);font-size:12px;line-height:1.2;white-space:nowrap}\n'''
              css_path.write_text(css, encoding="utf-8")
          PY
      - name: Verify focused regression
        run: |
          python -m pip install --disable-pip-version-check --editable '.[dev]'
          python -m pytest -q tests/test_studio_scene_counts.py
      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo "No patch needed"
            exit 0
          fi
          git config user.name "TerraLayer CI"
          git config user.email "321948909+terralayer@users.noreply.github.com"
          git add frontend/app.js frontend/ui_overrides.css
          git commit -m "Show studio downloaded and total scene counts"
          git push origin HEAD:feature/studio-scene-counts
