name: PR8 Apply Green

on:
  push:
    branches: [perf/0.3.10-download-pipeline]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v5
        with:
          ref: perf/0.3.10-download-pipeline
          fetch-depth: 0
      - name: Apply PR8 integration
        run: python .github/scripts/pr8_apply_green.py
      - name: Commit implementation
        run: |
          rm .github/workflows/pr8-apply-green.yml
          rm .github/scripts/pr8_apply_green.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scarletx/native_usenet.py scarletx/download_processing.py tools/benchmark_0310.py tests/test_performance_baseline.py .github/workflows/pr8-apply-green.yml .github/scripts/pr8_apply_green.py
          git commit -m 'perf: instrument and bound download pipeline'
          git push origin HEAD:perf/0.3.10-download-pipeline
