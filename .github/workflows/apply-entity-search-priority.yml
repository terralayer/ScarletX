name: Apply entity search priority

on:
  push:
    branches:
      - feat/monitored-entity-hourly-discovery
    paths:
      - .github/workflows/apply-entity-search-priority.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/monitored-entity-hourly-discovery
      - name: Prioritize newest release-ready scenes
        run: |
          python - <<'PY'
          from pathlib import Path
          path=Path('scarletx/automation.py')
          text=path.read_text()
          old='for scene in db.scalars(stmt.order_by(Scene.imported_at.asc())).all():'
          new='for scene in db.scalars(stmt.order_by(Scene.release_date.desc(),Scene.imported_at.desc())).all():'
          if text.count(old)!=1:
              raise SystemExit(f'expected one automatic-search order, found {text.count(old)}')
          path.write_text(text.replace(old,new,1))
          PY
      - name: Remove helper workflow
        run: git rm .github/workflows/apply-entity-search-priority.yml
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scarletx/automation.py
          git commit -m "fix: prioritize newly released monitored scenes"
          git push origin HEAD:feat/monitored-entity-hourly-discovery
