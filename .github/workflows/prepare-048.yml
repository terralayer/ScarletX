name: Prepare ScarletX 0.4.8 Metadata

on:
  push:
    branches:
      - release/0.4.8

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release branch
        uses: actions/checkout@v5
        with:
          ref: release/0.4.8
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Generate synchronized 0.4.8 metadata
        shell: bash
        run: |
          set -euo pipefail
          current="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [ "$current" = "0.4.8" ]; then
            echo "0.4.8 metadata already generated"
            exit 0
          fi
          test "$current" = "0.4.7"
          python - <<'PY'
          from pathlib import Path
          path = Path('tools/release_version.py')
          text = path.read_text()
          text = text.replace('LOCKED_RELEASE_VERSION = "0.4.7"', 'LOCKED_RELEASE_VERSION = "0.4.8"')
          path.write_text(text)
          PY
          notes=$'ScarletX 0.4.8 packages the dashboard row-alignment fix and current verified mainline into a stable release.\n\n## Dashboard\n\n- Aligns Recent Scenes and Upcoming Releases with identical list padding, row minimum height, vertical padding, and border-box sizing so the two panels read level.\n- Preserves the scalable top summary cards, compact sidebar, approved branding, footer, and existing tablet/mobile behavior.\n\n## Release\n\n- Publishes matching backend and web images for 0.4.8.\n- Advances the TrueNAS catalog package to 1.0.15 while preserving the current TrueNAS library pin.'
          generated="$(python tools/release_version.py apply --notes "$notes")"
          test "$generated" = "0.4.8"

      - name: Commit generated release metadata
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet && git diff --cached --quiet; then
            echo "No generated changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/release_version.py pyproject.toml scarletx README.md BUILD-INFO.txt start-scarletx.sh Start-ScarletX.ps1 docker-compose.truenas.yml packaging/truenas/scarletx RELEASE-NOTES-0.4.8.md
          git commit -m "release: generate ScarletX 0.4.8 metadata"
          git push origin HEAD:release/0.4.8
