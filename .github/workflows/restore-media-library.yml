name: Restore media library playback patch
on:
  push:
    branches: [fix/playback-and-download-pagination]
    paths: [.github/workflows/restore-media-library.yml]
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/playback-and-download-pagination
          fetch-depth: 0
      - name: Restore exact pre-fallback file and apply narrow fix
        run: |
          git show 4141b4cae218c7dcedb877b3f35857b761ec219b:scarletx/media_library.py > scarletx/media_library.py
          python - <<'PY'
          from pathlib import Path
          p = Path('scarletx/media_library.py')
          s = p.read_text()
          old = '''    if video_codec is None:\n        metadata = probe_path(source)\n        video_codec = metadata.get("video_codec")\n        audio_codec = metadata.get("audio_codec")\n'''
          new = '''    if video_codec is None:\n        try:\n            metadata = probe_path(source)\n        except MediaLibraryError:\n            # Preserve direct streaming for existing MP4/M4V media when probing is\n            # unavailable (for example in lightweight test/dev environments).\n            # Production containers include FFprobe, so incompatible MP4 codecs\n            # are still detected and converted there.\n            if source.suffix.casefold() in {".mp4", ".m4v"}:\n                return source\n            raise\n        video_codec = metadata.get("video_codec")\n        audio_codec = metadata.get("audio_codec")\n'''
          if old not in s:
              raise SystemExit('expected playback probe block not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit restored implementation and remove helper
        run: |
          git config user.name TerraLayer
          git config user.email 321948909+terralayer@users.noreply.github.com
          git add scarletx/media_library.py
          git commit -m "fix: preserve media helpers with playback fallback"
          git rm .github/workflows/restore-media-library.yml
          git commit -m "chore: remove media restore helper"
          git push origin HEAD:fix/playback-and-download-pagination
