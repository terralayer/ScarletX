name: Trigger ScarletX Patch Release

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/release-042-trigger.yml"

permissions:
  actions: write
  contents: read

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch locked ScarletX 0.4.5 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run release.yml \
            --repo terralayer/ScarletX \
            --ref main \
            -f release_notes='Synchronizes all ScarletX changes merged since 0.4.4 into the stable 0.4.5 release, including approved branding and favicon corrections, vector navigation icons, processing and activity improvements, Wanted state tracking, quality profiles and safe upgrades, safer matching and import flows, incremental scanning, duplicate detection, library health and resource protections, plus the locked footer correction that removes the generated Built with heart for the scene pseudo-footer.'
