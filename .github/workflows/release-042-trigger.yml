name: Trigger ScarletX Patch Release

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/release-042-trigger.yml"

permissions:
  actions: write
  contents: read

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch verified ScarletX patch release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run release.yml \
            --repo terralayer/ScarletX \
            --ref main \
            -f release_notes='Corrects ScarletX branding by shipping the exact approved horizontal logo artwork and exact approved ribbon-only favicon/app icon instead of reconstructed SVG approximations. Adds cache-busted UI references so browsers load the corrected assets immediately, while preserving the approved dashboard banner, navigation icons, configuration, and TrueNAS deployment behavior.'
