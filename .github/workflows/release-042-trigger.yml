name: Trigger ScarletX Patch Release

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/release-042-trigger.yml"

permissions:
  actions: write
  contents: read

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch verified ScarletX patch release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run release.yml \
            --repo terralayer/ScarletX \
            --ref main \
            -f release_notes='Updates ScarletX branding with the newly approved horizontal scarlet ribbon wordmark and matching ribbon-only favicon/app icon, while preserving the approved dashboard banner, SVG navigation icons, existing configuration, and TrueNAS deployment behavior.'
