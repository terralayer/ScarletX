name: PR81 calendar studio lookahead patch

on:
  push:
    branches:
      - fix/calendar-studio-lookahead

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/calendar-studio-lookahead
          fetch-depth: 0
      - name: Apply approved calendar contract
        run: |
          python - <<'PY'
          from pathlib import Path

          app = Path('scarletx/routes/application.py')
          source = app.read_text(encoding='utf-8')
          old = 'today = date.today(); start = start or today; end = end or date.max'
          new = 'today = date.today(); start = start or today; end = end or (today + timedelta(days=30))'
          if old not in source:
              raise SystemExit('calendar default horizon marker not found')
          app.write_text(source.replace(old, new, 1), encoding='utf-8')

          Path('tests/test_calendar_horizon_contract.py').write_text('''from datetime import date, timedelta\n\nfrom sqlalchemy import create_engine\nfrom sqlalchemy.orm import sessionmaker\nfrom sqlalchemy.pool import StaticPool\n\nfrom scarletx.db import Base\nfrom scarletx.models import Scene, Studio\nfrom scarletx.routes.application import calendar as calendar_route\n\n\ndef test_calendar_explicit_end_can_look_past_default_thirty_days():\n    engine = create_engine(\n        "sqlite:///:memory:",\n        connect_args={"check_same_thread": False},\n        poolclass=StaticPool,\n    )\n    Base.metadata.create_all(engine)\n    factory = sessionmaker(bind=engine, expire_on_commit=False)\n    today = date.today()\n\n    with factory() as db:\n        studio = Studio(tpdb_id="future-studio", name="Future Studio", monitored=True, is_library=True)\n        db.add(studio)\n        db.flush()\n        db.add(\n            Scene(\n                tpdb_id="future-180",\n                title="Future 180",\n                content_type="scene",\n                monitored=True,\n                release_date=today + timedelta(days=180),\n                studio_id=studio.id,\n            )\n        )\n        db.commit()\n        rows = calendar_route(\n            start=None,\n            end=today + timedelta(days=365),\n            limit=500,\n            db=db,\n        )\n\n    assert [row["title"] for row in rows] == ["Future 180"]\n''', encoding='utf-8')

          path = Path('tests/test_ui_calendar_optimization_batch.py')
          source = path.read_text(encoding='utf-8')
          source = source.replace(
              'def test_calendar_includes_future_scene_via_monitored_performer_relationship():',
              'def test_calendar_excludes_future_scene_via_monitored_performer_relationship():',
              1,
          )
          source = source.replace(
              '    assert [item["title"] for item in items] == ["Coming Soon"]',
              '    assert items == []',
              1,
          )
          old_route = '''def test_calendar_route_defaults_to_all_known_future_releases():\n    factory = make_factory()\n    far_future = date.today() + timedelta(days=180)\n    with factory() as db:\n        scene = Scene(\n            tpdb_id="s-beyond-90",\n            title="Beyond Ninety Days",\n            content_type="scene",\n            monitored=True,\n            release_date=far_future,\n        )\n        db.add(scene)\n        db.commit()\n        items = calendar_route(start=None, end=None, limit=500, db=db)\n    assert [item["title"] for item in items] == ["Beyond Ninety Days"]\n'''
          new_route = '''def test_calendar_route_defaults_to_thirty_day_studio_window():\n    factory = make_factory()\n    beyond_window = date.today() + timedelta(days=31)\n    with factory() as db:\n        studio = Studio(tpdb_id="st-window", name="Window Studio", monitored=True, is_library=True)\n        db.add(studio)\n        db.flush()\n        scene = Scene(\n            tpdb_id="s-beyond-30",\n            title="Beyond Thirty Days",\n            content_type="scene",\n            monitored=True,\n            release_date=beyond_window,\n            studio_id=studio.id,\n        )\n        db.add(scene)\n        db.commit()\n        items = calendar_route(start=None, end=None, limit=500, db=db)\n    assert items == []\n'''
          if old_route not in source:
              raise SystemExit('old calendar route regression not found')
          path.write_text(source.replace(old_route, new_route, 1), encoding='utf-8')

          path = Path('tests/test_monitored_entity_discovery.py')
          source = path.read_text(encoding='utf-8')
          source = source.replace(
              'async def test_future_scene_from_monitored_entity_appears_in_calendar(monkeypatch):',
              'async def test_future_scene_from_monitored_studio_appears_in_calendar(monkeypatch):',
              1,
          )
          old_setup = '        db.add(Performer(tpdb_id="person-1", name="Performer One", monitored=True, is_library=True))\n        db.commit()'
          new_setup = '        db.add(Studio(tpdb_id="studio-1", name="Studio One", monitored=True, is_library=True))\n        db.commit()'
          marker = source.index('async def test_future_scene_from_monitored_studio_appears_in_calendar')
          tail = source[marker:]
          if old_setup not in tail:
              raise SystemExit('calendar discovery setup not found')
          tail = tail.replace(old_setup, new_setup, 1)
          path.write_text(source[:marker] + tail, encoding='utf-8')
          PY
      - name: Remove one-shot workflow and commit
        run: |
          rm .github/workflows/pr81-calendar-contract-patch.yml
          git config user.name 'TerraLayer Automation'
          git config user.email '321948909+terralayer@users.noreply.github.com'
          git add scarletx/routes/application.py tests/test_calendar_horizon_contract.py tests/test_ui_calendar_optimization_batch.py tests/test_monitored_entity_discovery.py .github/workflows/pr81-calendar-contract-patch.yml
          git commit -m 'fix: scope calendar to monitored studios for 30 days'
          git push origin HEAD:fix/calendar-studio-lookahead
