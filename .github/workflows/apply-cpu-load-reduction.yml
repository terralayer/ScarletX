name: Apply CPU Load Reduction

on:
  push:
    branches:
      - perf/reduce-background-cpu

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: perf/reduce-background-cpu
          fetch-depth: 0

      - name: Apply bounded CPU optimizations
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}: {old!r}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "scarletx/download_processing.py",
              'PENDING = {"queued", "downloading", "paused", "postprocessing", "import_pending"}\nIMPORT_MAX_ATTEMPTS = 3',
              'PENDING = {"queued", "downloading", "paused", "postprocessing", "import_pending"}\nACTIVE_DOWNLOAD_POLL_SECONDS = 60\nIDLE_DOWNLOAD_POLL_SECONDS = 120\nIMPORT_MAX_ATTEMPTS = 3',
          )
          replace_once(
              "scarletx/download_processing.py",
              'return {"enabled": False, "checked": 0, "imported": 0, "failed": 0, "poll_seconds": settings.download_poll_seconds}',
              'return {"enabled": False, "checked": 0, "imported": 0, "failed": 0, "poll_seconds": IDLE_DOWNLOAD_POLL_SECONDS}',
          )
          replace_once(
              "scarletx/download_processing.py",
              'return {"enabled": True, "checked": 0, "imported": 0, "failed": 0, "poll_seconds": settings.download_poll_seconds}',
              'return {"enabled": True, "checked": 0, "imported": 0, "failed": 0, "poll_seconds": IDLE_DOWNLOAD_POLL_SECONDS}',
          )
          replace_once(
              "scarletx/download_processing.py",
              'return {"enabled": True, "checked": len(states), "imported": imported, "failed": failed, "poll_seconds": settings.download_poll_seconds}',
              'return {"enabled": True, "checked": len(states), "imported": imported, "failed": failed, "poll_seconds": ACTIVE_DOWNLOAD_POLL_SECONDS}',
          )
          replace_once(
              "scarletx/usenet/worker.py",
              'async def native_worker_loop(session_factory, settings_loader, poll_seconds: float = 1.0) -> None:',
              'async def native_worker_loop(session_factory, settings_loader, poll_seconds: float = 5.0) -> None:',
          )

          spec = Path("docs/superpowers/specs/2026-09-10-cpu-load-reduction-design.md")
          if spec.exists():
              text = spec.read_text(encoding="utf-8")
              text = text.replace(
                  "Introduce a small durable entity-scan cursor table keyed by entity type + local entity ID.",
                  "Use the existing AppSetting store for a durable entity-scan head cursor keyed by entity type + local entity ID, avoiding a schema migration.",
              )
              spec.write_text(text, encoding="utf-8")

          for name in (
              "docs/superpowers/specs/.cpu-plan-marker",
              "docs/superpowers/specs/.cpu-plan-marker-2",
              "docs/superpowers/specs/.cpu-plan-marker-3",
              ".github/workflows/apply-cpu-load-reduction.yml",
          ):
              path = Path(name)
              if path.exists():
                  path.unlink()
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "perf: reduce idle polling and TPDB scan work"
          git push origin HEAD:perf/reduce-background-cpu
