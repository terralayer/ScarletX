name: Tests

on:
  push:
    branches: [main, fix/native-dashboard-040]
  pull_request:
    branches: [main, release/0.3.10]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pytest:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "${{ matrix.python-version }}"
          cache: pip

      - name: Install project and test dependencies
        run: python -m pip install --disable-pip-version-check --editable '.[dev]'

      - name: Run tests
        run: timeout --signal=TERM 150s python -m pytest -vv --maxfail=1 -o faulthandler_timeout=120

      - name: Run Ruff
        if: matrix.python-version == '3.12'
        run: python -m ruff check scarletx tests tools

      - name: Verify source compilation
        run: python -m compileall -q scarletx tests tools

  benchmark:
    name: 0.3.10 performance baseline
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project and benchmark dependencies
        run: |
          python -m pip install --disable-pip-version-check --editable '.[dev]'
          python -m pip install --disable-pip-version-check psutil

      - name: Run five-sample benchmark suite
        run: python tools/benchmark.py --scenario all --samples 5 --json-out benchmark-results.json

      - name: Upload benchmark artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmark-results.json
          if-no-files-found: ignore

  dependency-audit:
    name: Python dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project and pip-audit
        run: |
          python -m pip install --disable-pip-version-check --editable .
          python -m pip install --disable-pip-version-check pip-audit

      - name: Audit installed dependencies
        run: python -m pip_audit --skip-editable

  container-build:
    name: Build container images
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Build backend image
        run: docker build -t scarletx:test .

      - name: Build Nginx web image
        run: docker build -f Dockerfile.web -t scarletx-web:test .
