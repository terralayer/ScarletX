name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, release/0.3.10]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  patch-pr4-source:
    name: Apply PR4 source patch
    if: github.event_name == 'pull_request' && github.head_ref == 'perf/0.3.10-progress-checkpoints'
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v5
        with:
          ref: perf/0.3.10-progress-checkpoints
          fetch-depth: 0

      - name: Apply exact replacements once
        run: |
          if [ "$(git log -1 --pretty=%s)" != "chore: arm PR4 source patch" ]; then
            echo "PR4 patch already applied; no-op"
            exit 0
          fi
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}: {old[:80]!r}")
              target.write_text(text.replace(old, new, 1))

          path = "scarletx/native_usenet.py"
          replace_once(path, "from sqlalchemy import select, update\n", "from sqlalchemy import event, select, update\n")
          replace_once(
              path,
              "from .status_console import emit_status\nfrom .models import History, NativeUsenetJob, TrackedDownload, utcnow\n",
              "from .status_console import emit_status\nfrom .models import History, NativeUsenetJob, TrackedDownload, utcnow\nfrom .progress import ProgressCheckpointGate\n",
          )
          replace_once(
              path,
              "_LIVE_PROGRESS_LOCK = threading.RLock()\n_LIVE_PROGRESS: dict[str, dict[str, float | int | None]] = {}\n",
              "_LIVE_PROGRESS_LOCK = threading.RLock()\n_LIVE_PROGRESS: dict[str, dict[str, float | int | None]] = {}\n_PROGRESS_FIELDS = (\"total_bytes\", \"downloaded_bytes\", \"speed_bps\", \"eta_seconds\")\n_PROGRESS_CHECKPOINT_GATE = ProgressCheckpointGate(\n    interval_seconds=2.0,\n    byte_threshold=8 * 1024 * 1024,\n)\n",
          )
          replace_once(
              path,
              "def _clear_live_progress(job_id: str) -> None:\n    with _LIVE_PROGRESS_LOCK:\n        _LIVE_PROGRESS.pop(job_id, None)\n",
              "def _clear_live_progress(job_id: str) -> None:\n    with _LIVE_PROGRESS_LOCK:\n        _LIVE_PROGRESS.pop(job_id, None)\n    _PROGRESS_CHECKPOINT_GATE.clear(job_id)\n\n\ndef apply_live_progress(job: NativeUsenetJob) -> bool:\n    \"\"\"Copy current in-memory counters onto an ORM job before its commit.\"\"\"\n    live = _get_live_progress(job.id)\n    changed = False\n    for field in _PROGRESS_FIELDS:\n        if field in live:\n            setattr(job, field, live[field])\n            changed = True\n    return changed\n\n\n@event.listens_for(NativeUsenetJob.status, \"set\")\ndef _apply_live_progress_on_status_set(job, value, oldvalue, _initiator) -> None:\n    if value != oldvalue:\n        apply_live_progress(job)\n\n\n@event.listens_for(NativeUsenetJob.cancel_requested, \"set\")\ndef _apply_live_progress_on_cancel_set(job, value, oldvalue, _initiator) -> None:\n    if value and value != oldvalue:\n        apply_live_progress(job)\n",
          )
          replace_once(
              path,
              "def _set_job(session_factory, job_id: str, **values) -> None:\n    # Lifecycle changes are persisted immediately. High-frequency transfer progress\n    # uses the in-memory path below and is flushed at most once per second.\n    live_values = {k: v for k, v in values.items() if k in {\"total_bytes\", \"downloaded_bytes\", \"speed_bps\", \"eta_seconds\"}}\n    if live_values:\n        _set_live_progress(job_id, **live_values)\n    values[\"updated_at\"] = utcnow()\n    with session_factory() as db:\n        db.execute(update(NativeUsenetJob).where(NativeUsenetJob.id == job_id).values(**values))\n        db.commit()\n\n\ndef _publish_progress(session_factory, job_id: str, *, total_bytes: int, downloaded_bytes: int, speed_bps: float, eta_seconds: int | None, persist: bool) -> None:\n    values = {\n        \"total_bytes\": int(total_bytes),\n        \"downloaded_bytes\": int(downloaded_bytes),\n        \"speed_bps\": float(speed_bps),\n        \"eta_seconds\": eta_seconds,\n    }\n    _set_live_progress(job_id, **values)\n    if persist:\n        _set_job(session_factory, job_id, **values)\n",
              "def _set_job(session_factory, job_id: str, **values) -> None:\n    # State transitions remain immediately durable. If they occur between throttled\n    # checkpoints, merge current live counters into the same database write.\n    live_values = {k: v for k, v in values.items() if k in _PROGRESS_FIELDS}\n    if live_values:\n        _set_live_progress(job_id, **live_values)\n    if \"status\" in values:\n        current_live = _get_live_progress(job_id)\n        for field in _PROGRESS_FIELDS:\n            if field in current_live:\n                values.setdefault(field, current_live[field])\n    values[\"updated_at\"] = utcnow()\n    with session_factory() as db:\n        db.execute(update(NativeUsenetJob).where(NativeUsenetJob.id == job_id).values(**values))\n        db.commit()\n\n\ndef _publish_progress(session_factory, job_id: str, *, total_bytes: int, downloaded_bytes: int, speed_bps: float, eta_seconds: int | None) -> None:\n    values = {\n        \"total_bytes\": int(total_bytes),\n        \"downloaded_bytes\": int(downloaded_bytes),\n        \"speed_bps\": float(speed_bps),\n        \"eta_seconds\": eta_seconds,\n    }\n    _set_live_progress(job_id, **values)\n    if _PROGRESS_CHECKPOINT_GATE.should_persist(job_id, values[\"downloaded_bytes\"], time.monotonic()):\n        _set_job(session_factory, job_id, **values)\n",
          )
          replace_once(path, "        last_progress_persist = 0.0\n        last_control_check = 0.0\n", "        last_control_check = 0.0\n")
          replace_once(
              path,
              "            nonlocal downloaded, session_downloaded, effective_total, last_progress_persist, last_control_check, active_window\n",
              "            nonlocal downloaded, session_downloaded, effective_total, last_control_check, active_window\n",
          )
          replace_once(
              path,
              "                persist = now - last_progress_persist >= 1.0\n                _publish_progress(\n                    session_factory, job_id,\n                    total_bytes=effective_total, downloaded_bytes=downloaded,\n                    speed_bps=speed, eta_seconds=eta, persist=persist,\n                )\n",
              "                _publish_progress(\n                    session_factory, job_id,\n                    total_bytes=effective_total, downloaded_bytes=downloaded,\n                    speed_bps=speed, eta_seconds=eta,\n                )\n",
          )
          replace_once(
              path,
              "                if persist:\n                    last_progress_persist = now\n\n                limit = float(settings.native_usenet_speed_limit_mb_s or 0)\n",
              "                limit = float(settings.native_usenet_speed_limit_mb_s or 0)\n",
          )
          replace_once(
              path,
              "            _publish_progress(\n                session_factory, job_id,\n                total_bytes=effective_total, downloaded_bytes=downloaded,\n                speed_bps=final_speed, eta_seconds=final_eta, persist=True,\n            )\n            last_progress_persist = final_now\n",
              "            _PROGRESS_CHECKPOINT_GATE.force(job_id)\n            _publish_progress(\n                session_factory, job_id,\n                total_bytes=effective_total, downloaded_bytes=downloaded,\n                speed_bps=final_speed, eta_seconds=final_eta,\n            )\n",
          )
          PY

          git diff --check
          git config user.name "TerraLayer"
          git config user.email "321948909+terralayer@users.noreply.github.com"
          git add scarletx/native_usenet.py
          git commit -m "perf: throttle durable progress checkpoints"
          git push origin HEAD:perf/0.3.10-progress-checkpoints

  pytest:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project and test dependencies
        run: python -m pip install --disable-pip-version-check --editable '.[dev]'

      - name: Run tests
        run: python -m pytest -q

      - name: Run Ruff
        if: matrix.python-version == '3.12'
        run: python -m ruff check scarletx tests tools

      - name: Verify source compilation
        run: python -m compileall -q scarletx tests tools

  benchmark:
    name: 0.3.10 performance baseline
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project and benchmark dependencies
        run: python -m pip install --disable-pip-version-check --editable '.[dev]'

      - name: Run five-sample benchmark suite
        run: |
          python tools/benchmark_0310.py --scenario all --iterations 5 --json /tmp/scarletx-0310-baseline.json
          echo '--- scarletx-0310-baseline.json ---'
          cat /tmp/scarletx-0310-baseline.json

  security-audit:
    name: Python dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project and pip-audit
        run: python -m pip install --disable-pip-version-check --editable . pip-audit

      - name: Audit installed dependencies
        run: python -m pip_audit

  container-builds:
    name: Build container images
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Build backend image
        run: docker build --file Dockerfile --tag scarletx-backend:ci .

      - name: Build Nginx web image
        run: docker build --file Dockerfile.web --tag scarletx-web:ci .
