name: Finalize bug-hunt UI
on:
  push:
    branches: [fix/bug-hunt-23]
    paths:
      - tools/finalize_bug_hunt_ui.py
      - .github/workflows/finalize-bug-hunt-ui.yml
permissions:
  contents: write
jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/bug-hunt-23
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python tools/finalize_bug_hunt_ui.py
      - run: rm tools/finalize_bug_hunt_ui.py .github/workflows/finalize-bug-hunt-ui.yml
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix: consolidate repaired UI behavior"
          git push origin HEAD:fix/bug-hunt-23
