name: PR9 Repair Relocated Contracts

on:
  push:
    branches: [refactor/0.3.10-module-boundaries]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refactor/0.3.10-module-boundaries
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Update characterization source locations
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str, count: int | None = 1) -> None:
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              found = text.count(old)
              if count is not None and found != count:
                  raise SystemExit(f'{path}: expected {count} occurrences of {old!r}, found {found}')
              if count is None and found < 1:
                  raise SystemExit(f'{path}: expected at least one occurrence of {old!r}')
              p.write_text(text.replace(old, new), encoding='utf-8')

          replace(
              'tests/test_download_pipeline.py',
              'NATIVE_SOURCE = ROOT / "scarletx" / "native_usenet.py"',
              'NATIVE_SOURCE = ROOT / "scarletx" / "usenet" / "worker.py"',
          )

          replace(
              'tests/test_hardening_039.py',
              'source = _source("scarletx/native_usenet.py")',
              'source = _source("scarletx/usenet/worker.py")',
          )

          p = Path('tests/test_queue_event_stream.py')
          text = p.read_text(encoding='utf-8')
          old = '''FRONTEND_INDEX = ROOT / "frontend" / "index.html"\nFRONTEND_AUTH = ROOT / "frontend" / "auth.js"\nMAIN = ROOT / "scarletx" / "main.py"\n'''
          new = '''FRONTEND_INDEX = ROOT / "frontend" / "index.html"\nFRONTEND_APP = ROOT / "frontend" / "app.js"\nFRONTEND_AUTH = ROOT / "frontend" / "auth.js"\nMAIN = ROOT / "scarletx" / "routes" / "application.py"\n'''
          if text.count(old) != 1:
              raise SystemExit('queue event stream constants did not match exactly once')
          text = text.replace(old, new, 1)
          text = text.replace(
              '''    index = FRONTEND_INDEX.read_text(encoding="utf-8")\n    auth = FRONTEND_AUTH.read_text(encoding="utf-8")\n    constructor = "new EventSource('/api/activity/stream')"\n\n    assert constructor not in index\n    assert auth.count(constructor) == 1\n    assert "scarletx:queue-event" in auth\n    assert "scarletx:queue-event" in index\n''',
              '''    index = FRONTEND_INDEX.read_text(encoding="utf-8")\n    app = FRONTEND_APP.read_text(encoding="utf-8")\n    auth = FRONTEND_AUTH.read_text(encoding="utf-8")\n    constructor = "new EventSource('/api/activity/stream')"\n\n    assert constructor not in index\n    assert constructor not in app\n    assert auth.count(constructor) == 1\n    assert "scarletx:queue-event" in auth\n    assert "scarletx:queue-event" in app\n''',
              1,
          )
          text = text.replace(
              '''    index = FRONTEND_INDEX.read_text(encoding="utf-8")\n    auth = FRONTEND_AUTH.read_text(encoding="utf-8")\n\n    assert "scarletx:queue-stream-fallback" in auth\n    assert "scarletx:queue-stream-fallback" in index\n    assert "source.onopen" in auth\n    assert "source.onerror" in auth\n    assert "setTimeout(refreshLiveQueue,1000)" not in index\n    assert "setTimeout(refreshLiveQueue,750)" not in index\n''',
              '''    index = FRONTEND_INDEX.read_text(encoding="utf-8")\n    app = FRONTEND_APP.read_text(encoding="utf-8")\n    auth = FRONTEND_AUTH.read_text(encoding="utf-8")\n\n    assert "scarletx:queue-stream-fallback" in auth\n    assert "scarletx:queue-stream-fallback" in app\n    assert "source.onopen" in auth\n    assert "source.onerror" in auth\n    assert "setTimeout(refreshLiveQueue,1000)" not in index + app\n    assert "setTimeout(refreshLiveQueue,750)" not in index + app\n''',
              1,
          )
          p.write_text(text, encoding='utf-8')

          p = Path('tests/test_release_contract.py')
          text = p.read_text(encoding='utf-8')
          text = text.replace(
              '"scarletx/main.py": f\'version="{VERSION}"\',',
              '"scarletx/routes/application.py": f\'version="{VERSION}"\',',
              1,
          )
          text = text.replace(
              'assert f\'"version": "{VERSION}"\' in text("scarletx/main.py")',
              'assert f\'"version": "{VERSION}"\' in text("scarletx/routes/application.py")',
              1,
          )
          text = text.replace(
              '        "scarletx/native_usenet.py",',
              '        "scarletx/usenet/worker.py",',
              1,
          )
          p.write_text(text, encoding='utf-8')

          p = Path('tests/test_status_console.py')
          text = p.read_text(encoding='utf-8')
          old_main = '(root / "scarletx" / "main.py").read_text()'
          if text.count(old_main) != 2:
              raise SystemExit(f'status console: expected 2 main source references, found {text.count(old_main)}')
          text = text.replace(old_main, '(root / "scarletx" / "routes" / "application.py").read_text()')
          old_native = '(root / "native_usenet.py").read_text()'
          if text.count(old_native) != 1:
              raise SystemExit(f'status console: expected 1 native source reference, found {text.count(old_native)}')
          text = text.replace(old_native, '(root / "usenet" / "worker.py").read_text()', 1)
          p.write_text(text, encoding='utf-8')

          p = Path('tools/benchmark_0310.py')
          text = p.read_text(encoding='utf-8')
          old = '''    auth_source = (repo_root / "frontend" / "auth.js").read_text(encoding="utf-8")\n    index_source = (repo_root / "frontend" / "index.html").read_text(encoding="utf-8")\n    eventsource = "new EventSource('/api/activity/stream')"\n'''
          new = '''    auth_source = (repo_root / "frontend" / "auth.js").read_text(encoding="utf-8")\n    index_source = (repo_root / "frontend" / "index.html").read_text(encoding="utf-8")\n    app_source = (repo_root / "frontend" / "app.js").read_text(encoding="utf-8")\n    eventsource = "new EventSource('/api/activity/stream')"\n'''
          if text.count(old) != 1:
              raise SystemExit('benchmark frontend source block did not match exactly once')
          text = text.replace(old, new, 1)
          text = text.replace(
              '"view_eventsource_count": index_source.count(eventsource),',
              '"view_eventsource_count": (index_source + app_source).count(eventsource),',
              1,
          )
          text = text.replace(
              '"recurring_queue_poll_markers": sum(index_source.count(marker) for marker in recurring_markers),',
              '"recurring_queue_poll_markers": sum((index_source + app_source).count(marker) for marker in recurring_markers),',
              1,
          )
          text = text.replace(
              'IDLE_UI_FALLBACK_INTERVAL_SECONDS if fallback_marker in index_source else 0',
              'IDLE_UI_FALLBACK_INTERVAL_SECONDS if fallback_marker in app_source else 0',
              1,
          )
          p.write_text(text, encoding='utf-8')
          PY
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check --editable '.[dev]'
      - name: Verify repaired contracts
        run: |
          python -m pytest tests/test_download_pipeline.py tests/test_hardening_039.py tests/test_idle_ui_benchmark.py tests/test_queue_event_stream.py tests/test_release_contract.py tests/test_status_console.py tests/test_module_boundaries.py -q
          python -m ruff check scarletx tests tools
          python -m compileall -q scarletx tests tools
      - name: Commit verified repair
        run: |
          rm .github/workflows/pr9-fix-ci-contracts.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'test: follow PR9 relocated implementation boundaries'
          git push origin HEAD:refactor/0.3.10-module-boundaries
