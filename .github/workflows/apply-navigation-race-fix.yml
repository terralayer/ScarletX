name: Apply navigation race fix

on:
  push:
    branches: [fix/ui-navigation-responsiveness]
    paths:
      - ".github/workflows/apply-navigation-race-fix.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v5
        with:
          ref: fix/ui-navigation-responsiveness
          fetch-depth: 0

      - name: Apply stale-view guards
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}: {old[:80]!r}")
              file.write_text(text.replace(old, new, 1), encoding="utf-8")

          app = "frontend/app.js"
          replace_once(
              app,
              "    let url=entityPageUrl(type,cursor,q),pending=entityPrefetch.get(url),data=pending?await pending:await api(url);entityPrefetch.delete(url);\n    paintEntityLibrary(type,data,append);if(data.has_more&&data.next_cursor)prefetchEntityPage(type,data.next_cursor,q);",
              "    let url=entityPageUrl(type,cursor,q),pending=entityPrefetch.get(url),data=pending?await pending:await api(url);entityPrefetch.delete(url);\n    if(view!==type)return;\n    paintEntityLibrary(type,data,append);if(data.has_more&&data.next_cursor)prefetchEntityPage(type,data.next_cursor,q);",
          )
          replace_once(
              app,
              "try{let d=await api(`/api/search/${type}?q=${encodeURIComponent(q)}`);let rows=d.items||d;",
              "try{let d=await api(`/api/search/${type}?q=${encodeURIComponent(q)}`);if(view!==type)return;let rows=d.items||d;",
          )
          replace_once(
              app,
              "try{let rows=await api('/api/wanted/missing?limit=500');",
              "try{let rows=await api('/api/wanted/missing?limit=500');if(view!=='wanted')return;",
          )
          replace_once(
              app,
              "    let [q,c,f,h]=await Promise.all([api('/api/activity/queue'),api('/api/downloads/completed?limit=100'),api('/api/downloads/failed'),api('/api/history?limit=200')]),rows=q.tracked||[],completed=c.scarletx||[],failed=f.scarletx||[];\n    liveQueueSnapshot=q;applyLiveQueue(q);",
              "    let [q,c,f,h]=await Promise.all([api('/api/activity/queue'),api('/api/downloads/completed?limit=100'),api('/api/downloads/failed'),api('/api/history?limit=200')]),rows=q.tracked||[],completed=c.scarletx||[],failed=f.scarletx||[];\n    if(view!=='activity')return;\n    liveQueueSnapshot=q;applyLiveQueue(q);",
          )
          replace_once(
              app,
              "try{let rows=await api('/api/calendar');",
              "try{let rows=await api('/api/calendar');if(view!=='calendar')return;",
          )
          replace_once(
              app,
              "  try{settingsCache=await api('/api/settings')}catch(e){return notify(e.message,'error')}\n  let tabs=",
              "  try{settingsCache=await api('/api/settings')}catch(e){return notify(e.message,'error')}\n  if(view!=='settings')return;\n  let tabs=",
          )

          overrides = "frontend/ui_overrides.js"
          replace_once(
              overrides,
              "    let [status,dupes,unmatched]=await Promise.all([api('/api/media-library/status'),api('/api/media-library/duplicates'),api('/api/media-library/unmatched?limit=200&offset=0')]);\n    let totalPages=",
              "    let [status,dupes,unmatched]=await Promise.all([api('/api/media-library/status'),api('/api/media-library/duplicates'),api('/api/media-library/unmatched?limit=200&offset=0')]);\n    if(view!=='library')return;\n    let totalPages=",
          )
          PY

      - name: Commit patch and remove helper workflow
        run: |
          git config user.name "TerraLayer"
          git config user.email "321948909+terralayer@users.noreply.github.com"
          git rm .github/workflows/apply-navigation-race-fix.yml
          git add frontend/app.js frontend/ui_overrides.js
          git commit -m "fix: ignore stale async page responses"
          git push origin HEAD:fix/ui-navigation-responsiveness
