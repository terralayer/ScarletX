name: Apply Status Console Alignment Fix

on:
  push:
    branches:
      - feature/status-console
    paths:
      - .github/workflows/status-console-alignment-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/status-console
      - name: Patch ANSI-aware dashboard alignment
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scarletx/status_console.py')
          text = path.read_text()

          old = '_CONTROL_RE = re.compile(r"[\\x00-\\x1f\\x7f]+")\n'
          new = old + '_ANSI_RE = re.compile(r"\\x1b\\[[0-9;]*m")\n'
          if old not in text:
              raise SystemExit('control regex anchor not found')
          text = text.replace(old, new, 1)

          old = '''def _header(title: str, *, color: bool, width: int = 66) -> str:\n    title = f" {sanitize_console_text(title, limit=40)} "\n    remaining = max(2, width - len(title) - 2)\n    left = remaining // 2\n    right = remaining - left\n    raw = f"┌{'─' * left}{title}{'─' * right}┐"\n    return _paint(raw, _CYAN, color)\n\n\ndef _footer(*, color: bool, width: int = 66) -> str:\n    return _paint("└" + "─" * width + "┘", _CYAN, color)\n'''
          new = '''def _visible_width(text: str) -> int:\n    return len(_ANSI_RE.sub("", text))\n\n\ndef _pad_visible(text: str, width: int) -> str:\n    return text + (" " * max(0, width - _visible_width(text)))\n\n\ndef _header(title: str, *, color: bool, width: int = 66) -> str:\n    title = f" {sanitize_console_text(title, limit=40)} "\n    remaining = max(0, width - len(title))\n    left = remaining // 2\n    right = remaining - left\n    raw = f"┌{'─' * left}{title}{'─' * right}┐"\n    return _paint(raw, _CYAN, color)\n\n\ndef _footer(*, color: bool, width: int = 66) -> str:\n    return _paint("└" + "─" * width + "┘", _CYAN, color)\n'''
          if old not in text:
              raise SystemExit('header/footer anchor not found')
          text = text.replace(old, new, 1)

          old = '''    for group in groups:\n        lines.append(_header(group.name, color=use_color))\n        for row in group.rows:\n            severities.append(row.severity)\n            lines.append("│ " + _row_line(row, color=use_color).ljust(64) + " │")\n        lines.append(_footer(color=use_color))\n        lines.append("")\n'''
          new = '''    for group in groups:\n        row_lines = [_row_line(row, color=use_color) for row in group.rows]\n        inner_width = max([66, *(_visible_width(line) + 2 for line in row_lines)])\n        lines.append(_header(group.name, color=use_color, width=inner_width))\n        for row, row_line in zip(group.rows, row_lines, strict=True):\n            severities.append(row.severity)\n            lines.append("│ " + _pad_visible(row_line, inner_width - 2) + " │")\n        lines.append(_footer(color=use_color, width=inner_width))\n        lines.append("")\n'''
          if old not in text:
              raise SystemExit('dashboard group render anchor not found')
          text = text.replace(old, new, 1)

          path.write_text(text)
          PY
      - name: Commit fix and remove one-shot helper
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scarletx/status_console.py
          git rm .github/workflows/status-console-alignment-patch.yml
          git commit -m 'fix: align colored status dashboard borders'
          git push origin HEAD:feature/status-console
