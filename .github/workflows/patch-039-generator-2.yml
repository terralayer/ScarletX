name: Separate 0.3.9 workflow changes

on:
  push:
    branches: [hardening-0.3.9]
    paths:
      - .github/workflows/patch-039-generator-2.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: hardening-0.3.9
          fetch-depth: 0
      - name: Keep workflow edits out of generated app commit
        shell: python
        run: |
          from pathlib import Path
          path = Path("tools/apply_039_hardening.py")
          text = path.read_text(encoding="utf-8")
          start = text.index("# Supply-chain checks.\n")
          dependabot = text.index('write(\n    ".github/dependabot.yml"', start)
          text = text[:start] + "# Supply-chain workflow changes are committed separately through the GitHub connector.\n" + text[dependabot:]
          text = text.replace('(ROOT / ".github/workflows/apply-039-hardening.yml").unlink(missing_ok=True)\n', '')
          path.write_text(text, encoding="utf-8")
      - name: Commit generator adjustment only
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/apply_039_hardening.py
          git commit -m "Separate hardening workflow changes"
          git push origin HEAD:hardening-0.3.9
