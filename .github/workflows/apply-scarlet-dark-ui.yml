name: Apply ScarletX Dark UI

on:
  push:
    branches: [scarlet-dark-ui]
    paths:
      - .github/workflows/apply-scarlet-dark-ui.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: scarlet-dark-ui
          fetch-depth: 0

      - name: Apply prepared UI patch
        run: git apply scripts/ScarletX-Scarlet-Dark-UI.patch

      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest

      - name: Validate UI theme
        run: python -m pytest -q tests/test_ui_theme.py

      - name: Commit dark UI
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scarletx/web/index.html tests/test_ui_theme.py
          git commit -m "Redesign ScarletX with dark scarlet UI"
          git push origin HEAD:scarlet-dark-ui
