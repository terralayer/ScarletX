name: Apply playback and activity pagination
on:
  push:
    branches: [fix/playback-and-download-pagination]
    paths: [.github/workflows/apply-playback-pagination.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/playback-and-download-pagination
      - name: Patch implementation
        run: |
          python - <<'PY'
          from pathlib import Path

          # media_library.py: cached browser-compatible playback target.
          p = Path('scarletx/media_library.py')
          s = p.read_text()
          anchor = '''def media_type_for(path: Path) -> str:\n    return mimetypes.guess_type(path.name)[0] or "application/octet-stream"\n'''
          insert = '''def media_type_for(path: Path) -> str:\n    return mimetypes.guess_type(path.name)[0] or "application/octet-stream"\n\n\ndef ensure_browser_playback(\n    media_id: int,\n    source: Path,\n    *,\n    video_codec: str | None = None,\n    audio_codec: str | None = None,\n    generated_root: Path | None = None,\n) -> Path:\n    """Return a browser-playable file, caching an MP4 fallback when required."""\n    source = Path(source)\n    if not source.exists() or not source.is_file():\n        raise MediaLibraryError(f"Media file does not exist: {source}")\n\n    if video_codec is None:\n        metadata = probe_path(source)\n        video_codec = metadata.get("video_codec")\n        audio_codec = metadata.get("audio_codec")\n\n    vcodec = (video_codec or "").casefold()\n    acodec = (audio_codec or "").casefold() or None\n    if source.suffix.casefold() in {".mp4", ".m4v"} and vcodec in {"h264", "avc1"} and acodec in {None, "aac", "mp3"}:\n        return source\n\n    root = (generated_root or GENERATED_ROOT) / "media" / str(media_id)\n    root.mkdir(parents=True, exist_ok=True)\n    target = root / "playback.mp4"\n    if target.exists() and target.stat().st_size > 0 and target.stat().st_mtime >= source.stat().st_mtime:\n        return target\n\n    temporary = root / "playback.tmp.mp4"\n    temporary.unlink(missing_ok=True)\n    command = [\n        "ffmpeg", "-y", "-v", "error", "-i", str(source),\n        "-map", "0:v:0", "-map", "0:a:0?", "-sn", "-dn",\n    ]\n    if vcodec in {"h264", "avc1"}:\n        command += ["-c:v", "copy"]\n    else:\n        command += ["-c:v", "libx264", "-preset", "veryfast", "-crf", "21", "-pix_fmt", "yuv420p", "-threads", "2"]\n    if acodec is None:\n        command += ["-an"]\n    elif acodec == "aac":\n        command += ["-c:a", "copy"]\n    else:\n        command += ["-c:a", "aac", "-b:a", "192k"]\n    command += ["-movflags", "+faststart", str(temporary)]\n    try:\n        _run(command, timeout=6 * 60 * 60)\n        if not temporary.exists() or temporary.stat().st_size <= 0:\n            raise MediaLibraryError("FFmpeg did not create a browser playback file")\n        os.replace(temporary, target)\n    finally:\n        temporary.unlink(missing_ok=True)\n    return target\n'''
          if anchor not in s:
              raise SystemExit('media_type_for anchor missing')
          s = s.replace(anchor, insert, 1)
          p.write_text(s)

          # worker.py: completed server-side offset.
          p = Path('scarletx/usenet/worker.py')
          s = p.read_text()
          old = '''def completed_rows(db, limit: int = 100) -> list[dict]:\n    rows = db.scalars(select(NativeUsenetJob).where(NativeUsenetJob.status == "completed").order_by(NativeUsenetJob.completed_at.desc()).limit(limit)).all()'''
          new = '''def completed_rows(db, limit: int = 100, offset: int = 0) -> list[dict]:\n    rows = db.scalars(select(NativeUsenetJob).where(NativeUsenetJob.status == "completed").order_by(NativeUsenetJob.completed_at.desc()).offset(offset).limit(limit)).all()'''
          if old not in s:
              raise SystemExit('completed_rows anchor missing')
          p.write_text(s.replace(old, new, 1))

          # application.py: compatibility playback and completed total/offset.
          p = Path('scarletx/routes/application.py')
          s = p.read_text()
          s = s.replace(
              '''    library_stats, media_row, media_rows, media_type_for, scan_library, tool_status as media_tool_status, update_playback,\n''',
              '''    ensure_browser_playback, library_stats, media_row, media_rows, media_type_for, scan_library, tool_status as media_tool_status, update_playback,\n''',
              1,
          )
          old = '''@app.get("/api/downloads/completed")\ndef completed_downloads(limit: int = Query(100, ge=1, le=500), db: Session = Depends(get_session)):\n    rows = native_completed_rows(db, limit)\n    ids = [row["id"] for row in rows]\n    tracked_by_id = {x.nzo_id:x for x in db.scalars(select(TrackedDownload).where(TrackedDownload.nzo_id.in_(ids))).all()} if ids else {}\n    return {"scarletx": [{**row,"scene_title":tracked_by_id[row["id"]].scene_title if row["id"] in tracked_by_id else None,"release_title":tracked_by_id[row["id"]].release_title if row["id"] in tracked_by_id else row.get("title"),"imported_at":tracked_by_id[row["id"]].imported_at if row["id"] in tracked_by_id else None} for row in rows]}'''
          new = '''@app.get("/api/downloads/completed")\ndef completed_downloads(limit: int = Query(20, ge=1, le=500), offset: int = Query(0, ge=0), db: Session = Depends(get_session)):\n    rows = native_completed_rows(db, limit, offset)\n    total = db.scalar(select(func.count()).select_from(NativeUsenetJob).where(NativeUsenetJob.status == "completed")) or 0\n    ids = [row["id"] for row in rows]\n    tracked_by_id = {x.nzo_id:x for x in db.scalars(select(TrackedDownload).where(TrackedDownload.nzo_id.in_(ids))).all()} if ids else {}\n    return {"scarletx": [{**row,"scene_title":tracked_by_id[row["id"]].scene_title if row["id"] in tracked_by_id else None,"release_title":tracked_by_id[row["id"]].release_title if row["id"] in tracked_by_id else row.get("title"),"imported_at":tracked_by_id[row["id"]].imported_at if row["id"] in tracked_by_id else None} for row in rows], "total": total, "limit": limit, "offset": offset}'''
          if old not in s:
              raise SystemExit('completed route anchor missing')
          s = s.replace(old, new, 1)
          old = '''@app.get("/api/media-files/{media_id}/stream")\ndef stream_media(media_id: int):\n    with SessionLocal() as db:\n        media = db.get(MediaFile, media_id)\n        if media is None:\n            raise HTTPException(404, "Media file not found")\n        path = Path(media.path)\n    if not path.exists() or not path.is_file():\n        raise HTTPException(404, "Media file is missing")\n    return FileResponse(path, media_type=media_type_for(path), filename=path.name, content_disposition_type="inline", headers={"Accept-Ranges": "bytes", "Cache-Control": "private, max-age=3600"})'''
          new = '''@app.get("/api/media-files/{media_id}/stream")\ndef stream_media(media_id: int):\n    with SessionLocal() as db:\n        media = db.get(MediaFile, media_id)\n        if media is None:\n            raise HTTPException(404, "Media file not found")\n        path = Path(media.path)\n        probe = db.get(MediaProbe, media_id)\n        video_codec = probe.video_codec if probe else None\n        audio_codec = probe.audio_codec if probe else None\n    if not path.exists() or not path.is_file():\n        raise HTTPException(404, "Media file is missing")\n    try:\n        playback_path = ensure_browser_playback(\n            media_id, path, video_codec=video_codec, audio_codec=audio_codec\n        )\n    except MediaLibraryError as exc:\n        raise HTTPException(422, f"Browser playback preparation failed: {exc}") from exc\n    return FileResponse(playback_path, media_type=media_type_for(playback_path), filename=playback_path.name, content_disposition_type="inline", headers={"Accept-Ranges": "bytes", "Cache-Control": "private, max-age=3600"})'''
          if old not in s:
              raise SystemExit('stream route anchor missing')
          p.write_text(s.replace(old, new, 1))

          # app.js: live queue 50/page and completed 20/page.
          p = Path('frontend/app.js')
          s = p.read_text()
          anchor = '''let liveQueueTimer=null,liveQueueBusy=false,liveQueueSnapshot={tracked:[],clients:{}};'''
          replacement = '''let liveQueueTimer=null,liveQueueBusy=false,liveQueueSnapshot={tracked:[],clients:{}};\nconst ACTIVITY_QUEUE_PAGE_SIZE=50,ACTIVITY_COMPLETED_PAGE_SIZE=20;\nlet activityQueuePage=1,activityCompletedPage=1,activityCompletedTotal=0;'''
          if anchor not in s:
              raise SystemExit('activity state anchor missing')
          s = s.replace(anchor, replacement, 1)
          anchor = '''function activityQueueHtml(rows){'''
          helper = '''function activityPager(kind,page,total,pageSize){let pages=Math.max(1,Math.ceil(total/pageSize));if(total<=pageSize)return'';return `<div class="pager activity-pager"><button class="btn small" data-activity-page="${kind}" data-page="${page-1}" ${page<=1?'disabled':''}>← Previous</button><span>Page ${page} of ${pages} · ${total}</span><button class="btn small" data-activity-page="${kind}" data-page="${page+1}" ${page>=pages?'disabled':''}>Next →</button></div>`}\nfunction activityQueueHtml(rows){'''
          if anchor not in s:
              raise SystemExit('activityQueueHtml anchor missing')
          s = s.replace(anchor, helper, 1)
          old = '''function applyLiveQueue(q){\n  let rows=q.tracked||[],el=$('#activityQueue');\n  if(el){\n    let current=[...el.querySelectorAll('[data-live-job]')],currentIds=current.map(r=>r.dataset.liveJob),nextIds=rows.map(x=>String(x.external_id||''));\n    if(!current.length||currentIds.join('|')!==nextIds.join('|')) el.innerHTML=activityQueueHtml(rows);\n    else rows.forEach((x,i)=>{'''
          new = '''function applyLiveQueue(q){\n  let allRows=q.tracked||[],el=$('#activityQueue'),pageCount=Math.max(1,Math.ceil(allRows.length/ACTIVITY_QUEUE_PAGE_SIZE));\n  activityQueuePage=Math.min(Math.max(1,activityQueuePage),pageCount);\n  let start=(activityQueuePage-1)*ACTIVITY_QUEUE_PAGE_SIZE,rows=allRows.slice(start,start+ACTIVITY_QUEUE_PAGE_SIZE);\n  if(el){\n    let current=[...el.querySelectorAll('[data-live-job]')],currentIds=current.map(r=>r.dataset.liveJob),nextIds=rows.map(x=>String(x.external_id||'')),pageKey=`${activityQueuePage}:${allRows.length}`;\n    if(!current.length||currentIds.join('|')!==nextIds.join('|')||el.dataset.pageKey!==pageKey){el.innerHTML=activityQueueHtml(rows)+activityPager('queue',activityQueuePage,allRows.length,ACTIVITY_QUEUE_PAGE_SIZE);el.dataset.pageKey=pageKey}\n    else rows.forEach((x,i)=>{'''
          if old not in s:
              raise SystemExit('applyLiveQueue anchor missing')
          s = s.replace(old, new, 1)
          old = '''  $('#activityQueue').onclick=async e=>{let b=e.target.closest('[data-native-act]');if(!b)return;b.disabled=true;try{await api(`/api/downloads/native/${encodeURIComponent(b.dataset.job)}/${b.dataset.nativeAct}`,post());await resyncLiveQueue()}catch(err){notify(err.message,'error');b.disabled=false}};\n  try{\n    let [q,c,f,h]=await Promise.all([api('/api/activity/queue'),api('/api/downloads/completed?limit=100'),api('/api/downloads/failed'),api('/api/history?limit=200')]),rows=q.tracked||[],completed=c.scarletx||[],failed=f.scarletx||[];'''
          new = '''  $('#activityQueue').onclick=async e=>{let pg=e.target.closest('[data-activity-page="queue"]');if(pg&&!pg.disabled){activityQueuePage=Number(pg.dataset.page)||1;applyLiveQueue(liveQueueSnapshot);return}let b=e.target.closest('[data-native-act]');if(!b)return;b.disabled=true;try{await api(`/api/downloads/native/${encodeURIComponent(b.dataset.job)}/${b.dataset.nativeAct}`,post());await resyncLiveQueue()}catch(err){notify(err.message,'error');b.disabled=false}};\n  try{\n    let completedOffset=(activityCompletedPage-1)*ACTIVITY_COMPLETED_PAGE_SIZE;\n    let [q,c,f,h]=await Promise.all([api('/api/activity/queue'),api(`/api/downloads/completed?limit=${ACTIVITY_COMPLETED_PAGE_SIZE}&offset=${completedOffset}`),api('/api/downloads/failed'),api('/api/history?limit=200')]),rows=q.tracked||[],completed=c.scarletx||[],failed=f.scarletx||[];\n    activityCompletedTotal=Number(c.total??completed.length);let completedPages=Math.max(1,Math.ceil(activityCompletedTotal/ACTIVITY_COMPLETED_PAGE_SIZE));if(activityCompletedPage>completedPages){activityCompletedPage=completedPages;return activity()}'''
          if old not in s:
              raise SystemExit('activity fetch anchor missing')
          s = s.replace(old, new, 1)
          old = '''    $('#activityCompleted').innerHTML=completed.length?`<div class="tablewrap" style="border:0;border-radius:0"><table class="table"><thead><tr><th>Scene</th><th>Size</th><th>Completed</th><th>Import</th><th>Post-processing</th><th></th></tr></thead><tbody>${completed.map(x=>`<tr><td><b>${esc(x.scene_title||x.release_title||x.title||'Download')}</b></td><td>${bytes(x.total_bytes||x.downloaded_bytes||0)}</td><td>${fmtDate(x.completed_at)}</td><td><span class="state ${x.imported_at?'good':'warn'}">${x.imported_at?'Imported':'Awaiting import'}</span></td><td><small>${esc(x.postprocess_note||'Download complete')}</small></td><td>${x.imported_at?'':`<button class="btn small primary" data-reprocess-completed data-job="${esc(x.id)}">Reprocess</button>`}</td></tr>`).join('')}</tbody></table></div>`:empty('No completed downloads yet.');\n    $('#activityCompleted').onclick=async e=>{let b=e.target.closest('[data-reprocess-completed]');if(!b)return;b.disabled=true;b.textContent='Reprocessing…';try{await api(`/api/downloads/native/${encodeURIComponent(b.dataset.job)}/reprocess`,post());notify('Completed payload reprocessed. Import will run automatically.','ok');activity()}catch(err){notify(err.message,'error');b.disabled=false;b.textContent='Reprocess'}};'''
          new = '''    $('#activityCompleted').innerHTML=(completed.length?`<div class="tablewrap" style="border:0;border-radius:0"><table class="table"><thead><tr><th>Scene</th><th>Size</th><th>Completed</th><th>Import</th><th>Post-processing</th><th></th></tr></thead><tbody>${completed.map(x=>`<tr><td><b>${esc(x.scene_title||x.release_title||x.title||'Download')}</b></td><td>${bytes(x.total_bytes||x.downloaded_bytes||0)}</td><td>${fmtDate(x.completed_at)}</td><td><span class="state ${x.imported_at?'good':'warn'}">${x.imported_at?'Imported':'Awaiting import'}</span></td><td><small>${esc(x.postprocess_note||'Download complete')}</small></td><td>${x.imported_at?'':`<button class="btn small primary" data-reprocess-completed data-job="${esc(x.id)}">Reprocess</button>`}</td></tr>`).join('')}</tbody></table></div>`:empty('No completed downloads yet.'))+activityPager('completed',activityCompletedPage,activityCompletedTotal,ACTIVITY_COMPLETED_PAGE_SIZE);\n    $('#activityCompleted').onclick=async e=>{let pg=e.target.closest('[data-activity-page="completed"]');if(pg&&!pg.disabled){activityCompletedPage=Number(pg.dataset.page)||1;return activity()}let b=e.target.closest('[data-reprocess-completed]');if(!b)return;b.disabled=true;b.textContent='Reprocessing…';try{await api(`/api/downloads/native/${encodeURIComponent(b.dataset.job)}/reprocess`,post());notify('Completed payload reprocessed. Import will run automatically.','ok');activity()}catch(err){notify(err.message,'error');b.disabled=false;b.textContent='Reprocess'}};'''
          if old not in s:
              raise SystemExit('completed render anchor missing')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit implementation and remove helper
        run: |
          git config user.name TerraLayer
          git config user.email 321948909+terralayer@users.noreply.github.com
          git add scarletx/media_library.py scarletx/usenet/worker.py scarletx/routes/application.py frontend/app.js
          git commit -m "fix: browser playback and paginate activity" || true
          git rm .github/workflows/apply-playback-pagination.yml
          git commit -m "chore: remove playback pagination patch helper"
          git push origin HEAD:fix/playback-and-download-pagination
