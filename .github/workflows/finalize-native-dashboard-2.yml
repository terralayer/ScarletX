name: Finalize native dashboard source retry

on:
  push:
    branches: [fix/native-dashboard-040]

permissions:
  contents: write

jobs:
  rewrite:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/native-dashboard-040
          fetch-depth: 0

      - name: Move native renderer into app.js
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          v2_path = Path('frontend/dashboard_v2.js')
          v2 = v2_path.read_text(encoding='utf-8').strip()
          assert v2.startswith('(() => {') and v2.endswith('})();')
          v2 = v2[len('(() => {'): -len('})();')].strip()
          v2 = v2.replace('const icons =', 'const dashboardIcons =')
          v2 = v2.replace('icons.', 'dashboardIcons.')
          v2 = v2.replace('function stat(', 'function dashboardStat(')
          v2 = v2.replace('stat(', 'dashboardStat(')
          v2 = v2.replace('function studioName(', 'function dashboardStudioName(')
          v2 = v2.replace('studioName(', 'dashboardStudioName(')
          v2 = v2.replace('function recentSceneRows(', 'function dashboardRecentRows(')
          v2 = v2.replace('recentSceneRows(', 'dashboardRecentRows(')
          v2 = v2.replace('function upcomingRows(', 'function dashboardUpcomingRows(')
          v2 = v2.replace('upcomingRows(', 'dashboardUpcomingRows(')
          v2 = v2.replace('dashboard = async function dashboard() {', 'async function dashboard(){')

          app_path = Path('frontend/app.js')
          app = app_path.read_text(encoding='utf-8')
          start = app.index('async function dashboard(){')
          end = app.index('function performerLinks', start)
          app_path.write_text(app[:start] + v2 + '\n' + app[end:], encoding='utf-8')

          index_path = Path('frontend/index.html')
          index_path.write_text(index_path.read_text(encoding='utf-8').replace('<script src="/dashboard_v2.js"></script>\n', ''), encoding='utf-8')

          docker_path = Path('Dockerfile.web')
          docker = docker_path.read_text(encoding='utf-8')
          docker = docker.replace('COPY frontend/dashboard_v2.js /usr/share/nginx/html/dashboard_v2.js\n', '')
          docker = docker.replace("    grep -q '/dashboard_v2.js' /usr/share/nginx/html/index.html; \\\n", '')
          docker_path.write_text(docker, encoding='utf-8')
          PY
          git rm frontend/dashboard_v2.js

      - name: Commit core renderer
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: make approved dashboard the core renderer"
          git push origin HEAD:fix/native-dashboard-040
