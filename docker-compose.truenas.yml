services:
  scarletx-permissions:
    image: ghcr.io/terralayer/scarletx:0.3.9
    container_name: scarletx-permissions
    pull_policy: always
    user: "0:0"
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command: >-
      chown -R 568:568 /config /downloads /backups &&
      find /media -type d -exec chown 568:568 {} +
    healthcheck:
      disable: true
    volumes:
      - ${SCARLETX_CONFIG_PATH:?Set SCARLETX_CONFIG_PATH}:/config
      - ${SCARLETX_DOWNLOADS_PATH:?Set SCARLETX_DOWNLOADS_PATH}:/downloads
      - ${SCARLETX_MEDIA_PATH:?Set SCARLETX_MEDIA_PATH}:/media
      - ${SCARLETX_BACKUPS_PATH:?Set SCARLETX_BACKUPS_PATH}:/backups

  scarletx-backend:
    image: ghcr.io/terralayer/scarletx:0.3.9
    container_name: scarletx-backend
    restart: unless-stopped
    pull_policy: always
    depends_on:
      scarletx-permissions:
        condition: service_completed_successfully
    environment:
      TZ: ${TZ:-Etc/UTC}
      SCARLETX_HOST: 0.0.0.0
      SCARLETX_PORT: "8000"
      SCARLETX_TRUST_PROXY_HEADERS: "1"
      SCARLETX_DATABASE_URL: sqlite:////config/scarletx.db
      SCARLETX_USENET_INCOMPLETE_DIR: /downloads/incomplete
      SCARLETX_USENET_COMPLETE_DIR: /downloads/complete
      SCARLETX_GENERATED_DIR: /config/generated
      SCARLETX_CACHE_DIR: /config/cache
      SCARLETX_DEFAULT_MEDIA_ROOT: /media
      SCARLETX_NO_BROWSER: "1"
    volumes:
      - ${SCARLETX_CONFIG_PATH:?Set SCARLETX_CONFIG_PATH}:/config
      - ${SCARLETX_DOWNLOADS_PATH:?Set SCARLETX_DOWNLOADS_PATH}:/downloads
      - ${SCARLETX_MEDIA_PATH:?Set SCARLETX_MEDIA_PATH}:/media
      - ${SCARLETX_BACKUPS_PATH:?Set SCARLETX_BACKUPS_PATH}:/backups
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import json,urllib.request; d=json.load(urllib.request.urlopen('http://127.0.0.1:8000/api/health',timeout=3)); raise SystemExit(0 if d.get('app')=='ScarletX' else 1)"
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  scarletx-web:
    image: ghcr.io/terralayer/scarletx-web:0.3.9
    container_name: scarletx-web
    restart: unless-stopped
    pull_policy: always
    environment:
      SCARLETX_WEB_PORT: ${SCARLETX_PORT:-8690}
    depends_on:
      scarletx-backend:
        condition: service_healthy
    ports:
      - "${SCARLETX_PORT:-8690}:${SCARLETX_PORT:-8690}"
