<!doctype html>
<html lang="en" data-theme="scarlet-dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ScarletX</title>
<link rel="icon" href="/scarletx-icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/styles.css">
<link rel="stylesheet" href="/ui_overrides.css">
<link rel="stylesheet" href="/locked_dashboard.css">
<link rel="stylesheet" href="/locked_dashboard_footer.css">
<link rel="stylesheet" href="/approved_assets.css">
<link rel="stylesheet" href="/ui_icons.css">
</head>
<body data-layout="approved-dashboard-v1" data-dashboard-render="native-v2">
<div class="shell">
  <aside class="sidebar">
    <div class="brand"><img src="/scarletx-wordmark.svg" alt="ScarletX"></div>
    <nav class="nav" id="nav">
      <button class="active" data-view="dashboard"><span class="ico"><svg data-icon="nav-home" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M9 21v-7h6v7"/></svg></span><span>Dashboard</span></button>
      <button data-view="performers"><span class="ico"><svg data-icon="nav-performers" viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="7" r="4"/><path d="M2 21v-2a4 4 0 0 1 4-4h6a4 4 0 0 1 4 4v2"/><path d="M16 3.3a4 4 0 0 1 0 7.4M22 21v-2a4 4 0 0 0-3-3.87"/></svg></span><span>Performers</span></button>
      <button data-view="scenes"><span class="ico"><svg data-icon="nav-scenes" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h16v12H4z"/><path d="m4 8 3-5h4L8 8m5 0 3-5h4l-3 5"/><path d="M4 3h16"/></svg></span><span>Scenes</span></button>
      <button data-view="studios"><span class="ico"><svg data-icon="nav-studios" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10h18M5 10v8m4-8v8m6-8v8m4-8v8M3 18h18M2 21h20"/><path d="m12 3 9 5H3z"/></svg></span><span>Studios</span></button>
      <button data-view="calendar"><span class="ico"><svg data-icon="nav-calendar" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/><path d="M8 14h.01M12 14h.01M16 14h.01M8 18h.01M12 18h.01M16 18h.01"/></svg></span><span>Calendar</span></button>
      <button type="button" data-approved-nav="discover"><span class="ico"><svg data-icon="nav-discover" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg></span><span>Discover</span></button>
      <button data-view="activity"><span class="ico"><svg data-icon="nav-downloads" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m0 0 4-4m-4 4-4-4"/><path d="M4 19h16v2H4z"/></svg></span><span>Downloads</span></button>
      <button type="button" data-approved-nav="indexers"><span class="ico"><svg data-icon="nav-indexers" viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="5" rx="7" ry="3"/><path d="M5 5v6c0 1.7 3.1 3 7 3s7-1.3 7-3V5M5 11v6c0 1.7 3.1 3 7 3s7-1.3 7-3v-6"/></svg></span><span>Indexers</span></button>
      <button data-view="settings"><span class="ico"><svg data-icon="nav-settings" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06-2.83 2.83-.06-.06A1.7 1.7 0 0 0 15 19.4a1.7 1.7 0 0 0-1 .6 1.7 1.7 0 0 0-.4 1.1V21h-4v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.88.34l-.06.06-2.83-2.83.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-.6-1 1.7 1.7 0 0 0-1.1-.4H3v-4h.1A1.7 1.7 0 0 0 4.6 8.5a1.7 1.7 0 0 0-.34-1.88l-.06-.06 2.83-2.83.06.06A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-.6 1.7 1.7 0 0 0 .4-1.1V3h4v.1A1.7 1.7 0 0 0 15.5 4.6a1.7 1.7 0 0 0 1.88-.34l.06-.06 2.83 2.83-.06.06A1.7 1.7 0 0 0 19.4 9c.13.37.34.7.6 1 .3.3.7.5 1.1.5h.1v4h-.1c-.4 0-.8.2-1.1.5-.26.3-.47.63-.6 1z"/></svg></span><span>Settings</span></button>
    </nav>
    <div class="side-spacer"></div>
    <div class="storage-card"><h4>Library Storage</h4><div class="bar"><i id="storageBar"></i></div><div class="storage-meta"><span id="storageUsed">—</span><span id="storagePct">—</span></div></div>
  </aside>
  <main class="main">
    <header class="topbar">
      <div class="header-brand"><img src="/scarletx-wordmark.svg" alt="ScarletX"></div>
      <form class="global-search" id="globalSearch"><span class="searchmark"><svg data-icon="top-search" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg></span><input id="globalSearchInput" placeholder="Search performers, scenes, studios…"></form>
      <div class="header-tagline">Your Adult Media Library, Automated.</div>
      <div class="top-spacer"></div>
      <button class="bell queue-pill" id="queueShortcut" type="button" title="Open download activity" aria-label="Open download activity"><span class="queue-glyph"><svg data-icon="top-bell" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/><path d="M10 21h4"/></svg></span><span class="queue-label">Downloads</span><span class="bell-badge" id="queueBadge">0</span></button>
      <div class="status-pill"><span class="profile-glyph"><svg data-icon="top-user" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4.5 21a7.5 7.5 0 0 1 15 0"/><circle cx="12" cy="12" r="10"/></svg></span><span class="dot" id="statusDot"></span><div><b id="hostLabel">local</b><small id="onlineText">Online</small></div></div>
    </header>
    <section class="content" id="app"></section>
  </main>
  <footer class="app-footer"><span class="footer-version">ScarletX <small id="versionSide">Local</small></span><span class="footer-motto">Discover More. Manage Smarter.</span></footer>
</div>
<div class="modalback" id="modal"><div class="modal"><div class="modal-head"><h2 id="modalTitle">Details</h2><button class="xbtn" id="closeModal">×</button></div><div class="modal-body" id="modalBody"></div></div></div>
<script src="/app.js"></script>
<script src="/navigation_error_overrides.js"></script>
<script>Object.assign(entityPageSize,{scenes:50,performers:50,studios:50})</script>
<script src="/ui_overrides.js"></script>
<script src="/activity_studio_overrides.js"></script>
<script src="/studio_art_overrides.js"></script>
<script src="/dashboard_settings_overrides.js"></script>
<script src="/dashboard_regression_hotfix.js"></script>
</body>
</html>
