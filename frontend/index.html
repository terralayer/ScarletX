<!doctype html>
<html lang="en" data-theme="scarlet-dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ScarletX</title>
<link rel="icon" href="/scarletx-icon.webp" type="image/webp">
<link rel="stylesheet" href="/styles.css">
<link rel="stylesheet" href="/ui_overrides.css">
<link rel="stylesheet" href="/locked_dashboard.css">
<link rel="stylesheet" href="/locked_dashboard_footer.css">
<link rel="stylesheet" href="/approved_assets.css">
</head>
<body data-layout="approved-dashboard-v1" data-dashboard-render="native-v2">
<div class="shell">
  <aside class="sidebar">
    <div class="brand"><img src="/scarletx-logo.webp" alt="ScarletX"></div>
    <nav class="nav" id="nav">
      <button class="active" data-view="dashboard"><span class="ico">⌂</span><span>Dashboard</span></button>
      <button data-view="performers"><span class="ico">♙</span><span>Performers</span></button>
      <button data-view="scenes"><span class="ico">▣</span><span>Scenes</span></button>
      <button data-view="studios"><span class="ico">▥</span><span>Studios</span></button>
      <button data-view="calendar"><span class="ico">▦</span><span>Calendar</span></button>
      <button type="button" data-approved-nav="discover"><span class="ico">⌕</span><span>Discover</span></button>
      <button data-view="activity"><span class="ico">⇩</span><span>Downloads</span></button>
      <button type="button" data-approved-nav="indexers"><span class="ico">⬡</span><span>Indexers</span></button>
      <button data-view="settings"><span class="ico">⚙</span><span>Settings</span></button>
    </nav>
    <div class="side-spacer"></div>
    <div class="storage-card"><h4>Library Storage</h4><div class="bar"><i id="storageBar"></i></div><div class="storage-meta"><span id="storageUsed">—</span><span id="storagePct">—</span></div></div>
  </aside>
  <main class="main">
    <header class="topbar">
      <div class="header-brand"><img src="/scarletx-logo.webp" alt="ScarletX"></div>
      <form class="global-search" id="globalSearch"><span class="searchmark">⌕</span><input id="globalSearchInput" placeholder="Search performers, scenes, studios…"></form>
      <div class="header-tagline">Your Adult Media Library, Automated.</div>
      <div class="top-spacer"></div>
      <button class="bell queue-pill" id="queueShortcut" type="button" title="Open download activity" aria-label="Open download activity"><span class="queue-glyph">♧</span><span class="queue-label">Downloads</span><span class="bell-badge" id="queueBadge">0</span></button>
      <div class="status-pill"><img class="approved-user-icon" src="/scarletx-icon.webp" alt=""><span class="dot" id="statusDot"></span><div><b id="hostLabel">local</b><small id="onlineText">Online</small></div></div>
    </header>
    <section class="content" id="app"></section>
  </main>
  <footer class="app-footer"><span class="footer-version">ScarletX <small id="versionSide">Local</small></span><span class="footer-motto">Discover More. Manage Smarter.</span></footer>
</div>
<div class="modalback" id="modal"><div class="modal"><div class="modal-head"><h2 id="modalTitle">Details</h2><button class="xbtn" id="closeModal">×</button></div><div class="modal-body" id="modalBody"></div></div></div>
<script src="/app.js"></script>
<script src="/navigation_error_overrides.js"></script>
<script>Object.assign(entityPageSize,{scenes:50,performers:50,studios:50})</script>
<script src="/ui_overrides.js"></script>
<script src="/activity_studio_overrides.js"></script>
<script src="/studio_art_overrides.js"></script>
<script src="/dashboard_settings_overrides.js"></script>
<script src="/dashboard_regression_hotfix.js"></script>
</body>
</html>
