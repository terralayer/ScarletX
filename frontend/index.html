/* ScarletX dark interface — permanent product theme */
*{scrollbar-color:#303744 #0b0e13}
*::selection{background:rgba(239,35,60,.34);color:#fff}
html,body{background:#06080c;color:var(--ink)}
body{min-width:320px}
button,input,select,textarea{color:var(--ink)}
input::placeholder,textarea::placeholder{color:#67717f}
input[type="checkbox"],input[type="radio"],input[type="range"]{accent-color:var(--scarlet)}
.shell{width:100%;min-height:100vh;margin:0;background:var(--bg);border:0;border-radius:0;overflow:visible;box-shadow:none;grid-template-columns:260px minmax(0,1fr)}
.sidebar{background:var(--sidebar);border-right:1px solid var(--line);min-height:100vh;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{height:92px;padding:18px 22px;border-bottom:1px solid var(--line);gap:13px;background:linear-gradient(180deg,#0d1016 0%,#0b0e13 100%)}
.brandmark{width:48px;height:48px;position:relative;flex:0 0 48px;filter:drop-shadow(0 0 12px rgba(239,35,60,.18))}
.xslash{position:absolute;left:50%;top:50%;width:13px;height:50px;border-radius:2px;background:linear-gradient(180deg,var(--scarlet-2),var(--scarlet) 56%,#c41230);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.xslash-a{transform:translate(-50%,-50%) rotate(45deg)}
.xslash-b{transform:translate(-50%,-50%) rotate(-45deg)}
.brandword{font-size:27px;font-weight:760;letter-spacing:-.9px;color:#f8fafc;line-height:1;white-space:nowrap}.brandword b{color:var(--scarlet);font-weight:800}
.nav{padding:12px 10px 18px;display:grid;gap:3px}.nav-section{padding:17px 12px 7px;color:#697381;text-transform:uppercase;letter-spacing:.085em;font-size:9px;font-weight:800}.nav-section:first-of-type{padding-top:19px}
.nav button{border:0;background:transparent;color:#aab2bd;border-radius:8px;text-align:left;padding:10px 12px;display:flex;align-items:center;gap:11px;font-weight:590;font-size:12px;transition:background .16s ease,color .16s ease,transform .16s ease}.nav button:hover{background:#131820;color:#eef2f7}.nav button.active{background:linear-gradient(90deg,rgba(239,35,60,.18),rgba(239,35,60,.07));color:#fff;box-shadow:inset 3px 0 0 var(--scarlet)}.nav button.active .ico{color:var(--scarlet)}.ico{width:18px;height:18px;color:#8d97a5;font-size:15px}
.side-spacer{min-height:22px}.storage-card{margin:12px;border:1px solid var(--line);border-radius:10px;background:#0f1319;padding:12px}.storage-card h4{color:#c8ced7}.bar{background:#252b34}.bar>i{background:linear-gradient(90deg,var(--scarlet),var(--scarlet-2));box-shadow:0 0 10px rgba(239,35,60,.28)}.storage-meta{color:var(--muted)}.side-footer{border-top:1px solid var(--line);padding:14px 16px;background:#0b0e13}.avatar{background:linear-gradient(145deg,#252b35,#171c24);color:#fff;border:1px solid #343b47}.side-footer b{color:#eef2f7}.side-footer small{color:#77818e}
.main{background:var(--bg);min-height:100vh}.main::after{content:"Built with ♥ for the scene.";display:block;text-align:center;color:#697381;font-size:11px;padding:28px 20px 34px}.topbar{height:74px;border-bottom:1px solid var(--line);padding:0 28px;gap:14px;background:rgba(9,12,17,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}

.player-shell video{background:#000;border:1px solid #202630;box-shadow:0 18px 45px rgba(0,0,0,.35)}.recent{margin-top:14px}.thumb{background:#10141a;border:1px solid #252c36}.thumb-meta span{background:rgba(4,6,9,.78)}.scene-card h3{color:#eef2f7}.scene-card p{color:var(--muted)}.monitor{color:var(--scarlet)}
.provider{border:1px solid var(--line);background:#0f141a}.mini-progress{background:#282f39}.mini-progress i{background:linear-gradient(90deg,var(--scarlet),var(--scarlet-2))}.client-chip{background:#1a2028;color:#aeb7c2;border:1px solid #2a313b}.tool-pill{background:#181e26;color:#aab3be;border:1px solid #272e38}.tool-pill.good{background:rgba(44,201,118,.09);color:#58db93;border-color:rgba(44,201,118,.18)}.tool-pill.warn{background:rgba(233,169,59,.09);color:#efb957;border-color:rgba(233,169,59,.18)}
.input,select,textarea,.global-search input{background:var(--input);border-color:#2a303a;color:#e8edf3}.input:focus,select:focus,textarea:focus{border-color:rgba(239,35,60,.58);box-shadow:0 0 0 3px rgba(239,35,60,.11)}select option{background:#11151c;color:#e8edf3}.tabs{background:#0d1117;border:1px solid #252c35;padding:3px}.tabs button{color:#8f99a6}.tabs button:hover{color:#e6ebf1}.tabs button.active{background:#1a2028;color:#ff5269;box-shadow:none;border:1px solid #2a323d}
.cardgrid{gap:15px}.media-card{border:1px solid var(--line);background:var(--panel);box-shadow:0 7px 22px rgba(0,0,0,.08)}.media-card.performer-card:hover,.media-card.studio-card:hover{transform:translateY(-2px);box-shadow:0 12px 30px rgba(0,0,0,.24);border-color:#3b4450}.media-poster{background:#090d12}.media-poster.performer-poster,.media-poster.performer-poster img{background:#0b0f14}.media-body h3{color:#f1f4f8}.media-body p{color:var(--muted)}.media-body .actions{border-top:1px solid #232934}.profile-image,.performer-full-image{background:#090d12;border-color:var(--line)}.profile-image img,.performer-full-image img{background:#090d12}.profile-fact{border-color:var(--line);background:#0f141a}.profile-fact b{color:#818b98}.profile-fact span{color:#e3e8ee}.profile-bio{color:#aeb7c2}.profile-section h2{color:#eef2f7}.empty{color:#7f8997;border:1px dashed #303844;background:#0d1117}
.notice.info{background:#121820;color:#aeb8c4;border:1px solid #27303a}.notice.ok{background:rgba(44,201,118,.08);color:#67dda0;border:1px solid rgba(44,201,118,.18)}.notice.error{background:rgba(255,77,97,.08);color:#ff8291;border:1px solid rgba(255,77,97,.18)}
.tablewrap{border:1px solid var(--line);background:var(--panel)}.table{color:#dbe1e8}.table th{color:#8f99a6;background:#0d1117;border-bottom:1px solid var(--line);font-size:9px;text-transform:uppercase;letter-spacing:.045em}.table td{border-bottom:1px solid #222832}.table tbody tr:hover{background:#141920}.scene-title{color:#eef2f7}.scene-title:hover,.person-link:hover,.studio-link:hover{color:#ff5269}.person-link,.studio-link{color:#b7c0cb}.state.good{color:#50d88d}.state.warn{color:#edb255}.state.bad{color:#ff6577}
.settings-layout{gap:20px}.settings-nav button{color:#8d97a4}.settings-nav button:hover{background:#121820;color:#e2e7ed}.settings-nav button.active{background:rgba(239,35,60,.12);color:#ff5269;border-left:2px solid var(--scarlet)}.settings-panel{border:1px solid var(--line);background:var(--panel);box-shadow:0 8px 28px rgba(0,0,0,.08)}.settings-panel h2{color:#f1f4f8}.settings-panel>p{color:var(--muted)}.field label{color:#aeb6c1}.field .hint{color:#737e8b}.divider{background:var(--line)}.indexer{border-color:var(--line);background:#0f141a}
.modalback{background:rgba(2,4,7,.74);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px)}.modal{background:var(--panel);border:1px solid #2a313b;border-radius:13px;box-shadow:0 28px 90px rgba(0,0,0,.58)}.modal-head{border-bottom:1px solid var(--line)}.modal-head h2{color:#f4f7fa}.modal-body{color:#d6dce4}.xbtn{background:#1a2028;color:#aeb7c2;border:1px solid #2c343f}.xbtn:hover{background:#242b35;color:#fff}
hr{border:0;border-top:1px solid var(--line)}a{color:#ff5269}code,pre{background:#0b0f14;color:#d8dee7;border-color:#272e38}

<body>
<div class="shell">
  <aside class="sidebar">
    <div class="brand"><div class="brandmark" aria-hidden="true"><span class="xslash xslash-a"></span><span class="xslash xslash-b"></span></div><div class="brandword">Scarlet<b>X</b></div></div>
    <nav class="nav" id="nav">
      <button class="active" data-view="dashboard"><span class="ico">⌂</span><span>Dashboard</span></button>
      <div class="nav-section">Discover</div>
      <button data-view="scenes"><span class="ico">▣</span><span>Scenes</span></button>
      <button data-view="library"><span class="ico">▶</span><span>Library</span></button>
      <button data-view="performers"><span class="ico">♙</span><span>Performers</span></button>
      <button data-view="studios"><span class="ico">▥</span><span>Studios</span></button>
      <button data-view="wanted"><span class="ico">◎</span><span>Wanted</span></button>
      <div class="nav-section">Manage</div>
      <button data-view="activity"><span class="ico">↓</span><span>Activity</span></button>
      <button data-view="calendar"><span class="ico">◷</span><span>Calendar</span></button>
      <div class="nav-section">System</div>
      <button data-view="settings"><span class="ico">⚙</span><span>Settings</span></button>
    </nav>
    <div class="side-spacer"></div>
    <div class="storage-card"><h4>Library Storage</h4><div class="bar"><i id="storageBar"></i></div><div class="storage-meta"><span id="storageUsed">—</span><span id="storagePct">—</span></div></div>
    <div class="side-footer"><div class="avatar">SX</div><div><b style="font-size:11px">ScarletX</b><small id="versionSide">Local</small></div></div>
  </aside>
  <main class="main">
    <header class="topbar">
      <form class="global-search" id="globalSearch"><span class="searchmark">⌕</span><input id="globalSearchInput" placeholder="Search scenes, performers, studios…"></form>
      <div class="top-spacer"></div>
      <button class="bell queue-pill" id="queueShortcut" type="button" title="Open download activity" aria-label="Open download activity"><span class="queue-glyph">↓</span><span class="queue-label">Downloads</span><span class="bell-badge" id="queueBadge">0</span></button>
      <div class="status-pill"><span class="dot" id="statusDot"></span><div><b id="hostLabel">local</b><small id="onlineText">Online</small></div></div>
    </header>
    <section class="content" id="app"></section>
  </main>
</div>
<div class="modalback" id="modal"><div class="modal"><div class="modal-head"><h2 id="modalTitle">Details</h2><button class="xbtn" id="closeModal">×</button></div><div class="modal-body" id="modalBody"></div></div></div>
<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
let view='dashboard', libraryCache=[], settingsCache=null, entityMode={scenes:'library',performers:'library',studios:'library'};
let entityLibraryCache={scenes:null,performers:null,studios:null},entityCursors={scenes:null,performers:null,studios:null},entityTotals={scenes:null,performers:null,studios:null},entityPageSize={scenes:100,performers:60,studios:60};
let entityLibraryQuery={scenes:'',performers:'',studios:''},entityPrefetch=new Map();
let mediaLibraryRows=[],mediaLibraryCursor=null,mediaLibraryHasMore=false,mediaLibraryPrefetch=new Map();
let liveQueueTimer=null,liveQueueBusy=false,liveQueueSnapshot={tracked:[],clients:{}};
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtDate=v=>v?new Date(v).toLocaleDateString(undefined,{year:'numeric',month:'short',day:'numeric'}):'—';
const bytes=n=>{if(!n&&n!==0)return'—';let u=['B','KB','MB','GB','TB'],i=0,x=Number(n);while(x>=1024&&i<u.length-1){x/=1024;i++}return`${x.toFixed(i>2?2:i?1:0)} ${u[i]}`};
const durationText=n=>{if(n==null)return'—';let x=Math.max(0,Math.floor(Number(n))),h=Math.floor(x/3600),m=Math.floor((x%3600)/60),sec=x%60;return h?`${h}:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`:`${m}:${String(sec).padStart(2,'0')}`};
const api=async(path,opts={})=>{let h={'Content-Type':'application/json',...(opts.headers||{})};let r=await fetch(path,{...opts,headers:h});if(r.status===204)return null;let text=await r.text(),data;try{data=JSON.parse(text)}catch{data=text}if(!r.ok)throw new Error(data?.detail||data||`${r.status}`);return data};
const patch=body=>({method:'PATCH',body:JSON.stringify(body)}), post=body=>({method:'POST',body:body===undefined?undefined:JSON.stringify(body)}), put=body=>({method:'PUT',body:JSON.stringify(body)});
function notify(msg,type='info'){let n=document.createElement('div');n.className=`notice ${type}`;n.textContent=msg;$('#app').prepend(n);setTimeout(()=>n.remove(),4500)}
function nav(){$$('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===view))}
function pageHead(title,sub,actions=''){return `<div class="pagehead"><div><h1>${esc(title)}</h1></div><div class="actions">${actions}</div></div>`}
function empty(msg){return `<div class="empty">${esc(msg)}</div>`}
function sceneImage(x){return x.image_url||x.back_image_url||''}
function modal(title,html){$('#modalTitle').textContent=title;$('#modalBody').innerHTML=html;$('#modal').classList.add('open')}
$('#closeModal').onclick=()=>$('#modal').classList.remove('open');$('#modal').onclick=e=>{if(e.target===$('#modal'))$('#modal').classList.remove('open')};

async function boot(){
  $('#hostLabel').textContent=location.hostname||'local';
  $('#nav').onclick=e=>{let b=e.target.closest('button[data-view]');if(!b)return;view=b.dataset.view;nav();render()};
  $('#queueShortcut').onclick=()=>{view='activity';nav();render()};
  $('#globalSearch').onsubmit=e=>{e.preventDefault();let q=$('#globalSearchInput').value.trim();if(q.length<2)return;view='scenes';entityMode.scenes='search';nav();renderEntities('scenes',q)};
  try{let s=await api('/api/system/status');$('#versionSide').textContent=`v${s.version} · Local`}catch(e){$('#onlineText').textContent='Offline';$('#statusDot').style.background='#b91c2b'}
  await updateChrome();render();
}
async function updateChrome(){
  try{
    let [a,d]=await Promise.all([api('/api/activity/queue').catch(()=>({tracked:[]})),api('/api/system/diskspace').catch(()=>[])]);
    $('#queueBadge').textContent=(a.tracked||[]).length;
    let x=d.find(i=>i.exists&&i.total_bytes)||d.find(i=>i.exists);
    if(x&&x.total_bytes){let pct=Math.round((x.used_bytes/x.total_bytes)*100);$('#storageBar').style.width=`${pct}%`;$('#storageUsed').textContent=`${bytes(x.used_bytes)} / ${bytes(x.total_bytes)}`;$('#storagePct').textContent=`${pct}%`}
  }catch{}
}
function stopLiveQueue(){if(liveQueueTimer){clearTimeout(liveQueueTimer);liveQueueTimer=null}liveQueueBusy=false}
async function render(){nav();if(view==='dashboard')return dashboard();if(view==='library')return mediaLibrary();if(['scenes','performers','studios'].includes(view))return renderEntities(view);if(view==='wanted')return wanted();if(view==='activity')return activity();if(view==='calendar')return calendar();if(view==='settings')return settings()}

async function dashboard(){
  $('#app').innerHTML=pageHead('Welcome back','Here’s what’s happening with your library.',`<button class="btn primary" id="addNew">＋ Add New</button>`)+`<div class="stats" id="stats"></div><div class="dashgrid"><div class="panel"><div class="panel-head"><h2>Activity Queue</h2><button class="linkbtn" data-go="activity">View all</button></div><div class="rows" id="queueRows"></div></div><div class="panel"><div class="panel-head"><h2>Recent Activity</h2><button class="linkbtn" data-go="activity">View all</button></div><div class="rows" id="historyRows"></div></div><div class="panel"><div class="panel-head"><h2>Upcoming</h2><button class="linkbtn" data-go="calendar">View calendar</button></div><div class="rows" id="calendarRows"></div></div></div><div class="panel recent"><div class="panel-head"><h2>Recently Added Scenes</h2><button class="linkbtn" data-go="scenes">View library</button></div><div id="recentScenes" style="padding:0 12px 14px"></div></div>`;
  $('#addNew').onclick=()=>{view='scenes';entityMode.scenes='search';nav();renderEntities('scenes')};
  $('#app').onclick=e=>{let b=e.target.closest('[data-go]');if(b){view=b.dataset.go;nav();render()}};
  try{
    let [sys,recent,queue,hist,cal,disk]=await Promise.all([api('/api/system/status'),api('/api/library/scenes/page?limit=8'),api('/api/activity/queue').catch(()=>({tracked:[]})),api('/api/history?limit=8'),api('/api/calendar?limit=5'),api('/api/system/diskspace').catch(()=>[])]);
    let scenes=recent.items||[];libraryCache=scenes;
    let total=0,used=0;disk.filter(x=>x.exists&&x.total_bytes).forEach(x=>{total+=x.total_bytes;used+=x.used_bytes});let pct=total?Math.round(used/total*100):0;
    $('#stats').innerHTML=[['▣','Scenes',sys.library?.scene||0,'Adult library'],['♙','Performers',sys.performers||0,'In library'],['▥','Studios',sys.studios||0,'In library'],['◎','Wanted',sys.wanted||0,'Missing'],['▱','Storage',total?bytes(used):'—',total?`${pct}% of ${bytes(total)}`:'No scene root yet']].map(x=>`<div class="stat"><div class="stat-icon">${x[0]}</div><div><small>${x[1]}</small><strong>${x[2]}</strong><em>${x[3]}</em></div></div>`).join('');
    $('#queueRows').innerHTML=(queue.tracked||[]).slice(0,5).map(x=>`<div class="row"><div class="rowicon">↓</div><div><b>${esc(x.release_title||x.scene_title||'Download')}</b><small>${esc(x.status||'queued')}</small></div><span class="badge soft">${esc(x.status?.slice(0,1)?.toUpperCase()||'Q')}</span></div>`).join('')||`<div class="row"><div class="rowicon">✓</div><div><b>Queue clear</b><small>No active downloads</small></div><span class="check">✓</span></div>`;
    $('#historyRows').innerHTML=hist.slice(0,5).map(x=>`<div class="row"><div class="rowicon">↻</div><div><b>${esc(x.message)}</b><small>${fmtDate(x.created_at)}</small></div><span class="check">✓</span></div>`).join('')||`<div class="row"><div class="rowicon">•</div><div><b>No activity yet</b><small>ScarletX activity will appear here.</small></div></div>`;
    $('#calendarRows').innerHTML=cal.slice(0,5).map(x=>`<div class="row"><div class="rowicon">${new Date(x.date).getDate()}</div><div><b>${esc(x.title)}</b><small>${fmtDate(x.date)}</small></div><span class="badge soft">Scene</span></div>`).join('')||`<div class="row"><div class="rowicon">□</div><div><b>No upcoming releases</b><small>Monitored release dates will appear here.</small></div></div>`;
    $('#recentScenes').innerHTML=scenes.length?sceneTable(scenes.slice(0,8),true):empty('Add your first scene to start building the library.');bindSceneTableActions($('#recentScenes'),true);
  }catch(e){notify(e.message,'error')}
}
function performerLinks(x){
  let rows=x.performers||[];
  return rows.length?`<div class="credit-links">${rows.map(p=>`<button class="person-link" data-performer-link="${esc(p.id||p.tpdb_id||'')}" title="Open performer profile">${esc(p.name||'Performer')}</button>`).join('')}</div>`:'<span class="muted">—</span>';
}
function studioLink(x){let st=x.studio;if(!st)return '<span class="muted">—</span>';let name=typeof st==='string'?st:(st.name||'Studio'),id=typeof st==='object'?(st.id||st.tpdb_id||''):(x.studio_id||'');return id?`<button class="studio-link" data-studio-link="${esc(id)}">${esc(name)}</button>`:esc(name)}
function sceneRowsHtml(rows,inLibrary=false){return rows.map(x=>{let id=x.tpdb_id||x.id,local=inLibrary?x.id:'',hasFile=inLibrary&&(x.has_file||(x.files||[]).length>0);return `<tr data-scene-id="${esc(id)}" data-local-id="${esc(local)}"><td><button class="scene-title" data-scene-detail>${esc(x.title||'Untitled')}</button></td><td>${studioLink(x)}</td><td>${fmtDate(x.release_date)}</td><td>${performerLinks(x)}</td><td><div class="scene-status">${inLibrary?`<span class="state ${x.monitored?'good':'warn'}">${x.monitored?'Monitored':'Not monitored'}</span>${hasFile?'<span class="state good">Downloaded</span>':''}`:`<span class="state ${['Downloaded','Downloading','Queued','Post-processing','Import pending'].includes(x.download_status)?'good':x.download_status==='Failed'?'bad':'warn'}">${esc(x.download_status||'Available')}</span>`}</div></td><td><div class="actions">${(!inLibrary||!x.monitored)?'<button class="btn small primary" data-monitor-scene>Monitor</button>':''}${inLibrary?'<button class="btn small danger" data-remove-scene>Remove</button>':'<button class="btn small" data-scene-detail>Details</button>'}</div></td></tr>`}).join('')}
function sceneTable(rows,inLibrary=false){if(!rows.length)return empty('No scenes found.');return `<div class="tablewrap"><table class="table"><thead><tr><th>Scene</th><th>Studio</th><th>Release</th><th>Performers</th><th>Status</th><th></th></tr></thead><tbody>${sceneRowsHtml(rows,inLibrary)}</tbody></table></div>`}
function bindSceneTableActions(root,inLibrary){
  if(!root)return;root.onclick=async e=>{
    let p=e.target.closest('[data-performer-link]');if(p)return performerProfile(p.dataset.performerLink,null);
    let st=e.target.closest('[data-studio-link]');if(st)return studioProfile(st.dataset.studioLink,null);
    let tr=e.target.closest('tr[data-scene-id]');if(!tr)return;let id=tr.dataset.sceneId,local=tr.dataset.localId;
    let b=e.target.closest('button');if(!b)return;
    try{
      if(b.hasAttribute('data-monitor-scene')){b.disabled=true;b.textContent='Starting…';await api(inLibrary?`/api/library/scenes/${local}/monitor`:`/api/metadata/scenes/${encodeURIComponent(id)}/monitor`,post());b.remove();notify('Monitored. ScarletX is searching and downloading in the background.','ok');return}
      if(b.hasAttribute('data-remove-scene')){if(!confirm('Remove this scene from ScarletX?'))return;await api(`/api/library/scenes/${local}`,{method:'DELETE'});return loadEntityLibrary('scenes')}
      if(b.hasAttribute('data-scene-detail'))return scenePage(id,inLibrary?local:null);
    }catch(err){notify(err.message,'error');b.disabled=false;b.textContent='Monitor'}
  }
}

async function renderEntities(type,forcedQuery=''){

function numericPart(v){let m=String(v??'').replace(/,/g,'.').match(/-?\d+(?:\.\d+)?/);return m?Number(m[0]):null}

async function resyncLiveQueue(){

function mergeLiveQueueJob(job){
  let rows=[...(liveQueueSnapshot.tracked||[])],key=String(job.external_id||job.id||''),i=rows.findIndex(x=>String(x.external_id||x.id||'')===key);

window.addEventListener('scarletx:queue-event',e=>{
  let detail=e.detail||{},kind=detail.kind,payload=detail.payload||{};

  }

 if(settingsTab==='metadata'){el.innerHTML=`<div class="settings-panel"><h2>ThePornDB</h2><p>Primary metadata source for scenes, performers, and studios.</p><div class="formgrid"><div class="field span2"><label>API key</label><input class="input" id="tpdbKey" type="password" placeholder="${s.theporndb.configured?'Configured — leave blank to keep current':'Enter TPDB API key'}"><span class="hint">This local development preview includes a baked TPDB development key. Saving another key here overrides it locally.</span></div><div class="field span2"><label>API URL</label><input class="input" id="tpdbUrl" value="${esc(s.theporndb.base_url)}"></div></div><div class="divider"></div><button class="btn primary" id="saveTPDB">Save TPDB</button></div>`;$('#saveTPDB').onclick=()=>saveSetting('/api/settings/theporndb',{api_key:val('#tpdbKey')||null,base_url:val('#tpdbUrl')});return}
 if(settingsTab==='indexers')return renderIndexers();
 if(settingsTab==='downloads')return renderDownloadSettings();
 if(settingsTab==='media')return renderMediaSettings();
 if(settingsTab==='automation'){let a=s.automation,r=s.rss;el.innerHTML=`<div class="settings-panel"><h2>Automation</h2><p>Automatic scene searches and RSS matching.</p><div class="formgrid"><div class="field"><label>Automatic search</label><select id="autoEnabled"><option value="true" ${a.enabled?'selected':''}>Enabled</option><option value="false" ${!a.enabled?'selected':''}>Disabled</option></select></div><div class="field"><label>Interval minutes</label><input class="input" id="autoInterval" type="number" min="5" value="${a.interval_minutes}"></div><div class="field"><label>Batch size</label><input class="input" id="autoBatch" type="number" min="1" value="${a.batch_size}"></div></div><div class="divider"></div><h2>RSS</h2><div class="formgrid"><div class="field"><label>RSS sync</label><select id="rssEnabled"><option value="true" ${r.enabled?'selected':''}>Enabled</option><option value="false" ${!r.enabled?'selected':''}>Disabled</option></select></div><div class="field"><label>Interval minutes</label><input class="input" id="rssInterval" type="number" min="5" value="${r.interval_minutes}"></div><div class="field"><label>Releases per indexer</label><input class="input" id="rssMax" type="number" min="10" value="${r.max_releases_per_indexer}"></div><div class="field"><label>Max grabs per cycle</label><input class="input" id="rssGrab" type="number" min="1" value="${r.max_grabs_per_cycle}"></div></div><div class="divider"></div><button class="btn primary" id="saveAuto">Save Automation</button></div>`;$('#saveAuto').onclick=async()=>{await api('/api/settings/automation',patch({enabled:val('#autoEnabled')==='true',interval_minutes:Number(val('#autoInterval')),batch_size:Number(val('#autoBatch'))}));await api('/api/settings/rss',patch({enabled:val('#rssEnabled')==='true',interval_minutes:Number(val('#rssInterval')),max_releases_per_indexer:Number(val('#rssMax')),max_grabs_per_cycle:Number(val('#rssGrab'))}));notify('Automation settings saved.','ok');settings()};return}
 if(settingsTab==='backups'){let b=s.backups;el.innerHTML=`<div class="settings-panel"><h2>Backups</h2><p>Local SQLite database backup rotation.</p><div class="formgrid"><div class="field"><label>Enabled</label><select id="backupEnabled"><option value="true" ${b.enabled?'selected':''}>Enabled</option><option value="false" ${!b.enabled?'selected':''}>Disabled</option></select></div><div class="field"><label>Directory</label><input class="input" id="backupDir" value="${esc(b.directory)}"></div><div class="field"><label>Interval hours</label><input class="input" id="backupHours" type="number" value="${b.interval_hours}"></div><div class="field"><label>Keep</label><input class="input" id="backupKeep" type="number" value="${b.keep}"></div></div><div class="divider"></div><div class="actions"><button class="btn primary" id="saveBackup">Save</button><button class="btn" id="backupNow">Backup Now</button></div></div>`;$('#saveBackup').onclick=()=>saveSetting('/api/settings/backups',{enabled:val('#backupEnabled')==='true',directory:val('#backupDir'),interval_hours:Number(val('#backupHours')),keep:Number(val('#backupKeep'))});$('#backupNow').onclick=async()=>{try{let r=await api('/api/backups',post());notify(`Backup created: ${r.path}`,'ok')}catch(e){notify(e.message,'error')}};return}
 if(settingsTab==='security'){let z=s.security;el.innerHTML=`<div class="settings-panel"><h2>API Security</h2><p>Optional API-key protection for ScarletX API routes.</p><div class="formgrid"><div class="field"><label>API key protection</label><select id="apiEnabled"><option value="true" ${z.api_key_enabled?'selected':''}>Enabled</option><option value="false" ${!z.api_key_enabled?'selected':''}>Disabled</option></select></div><div class="field"><label>API key</label><input class="input" id="apiKey" type="password" placeholder="${z.api_key_configured?'Configured — blank keeps current':'Enter a key'}"></div></div><div class="divider"></div><button class="btn primary" id="saveSecurity">Save</button></div>`;$('#saveSecurity').onclick=()=>saveSetting('/api/settings/security',{api_key_enabled:val('#apiEnabled')==='true',api_key:val('#apiKey')||null});return}
 if(settingsTab==='system'){el.innerHTML=`<div class="settings-panel"><h2>System</h2><p>Runtime health and storage.</p><div id="systemSettings">Loading…</div></div>`;let [st,h,d]=await Promise.all([api('/api/system/status'),api('/api/system/health'),api('/api/system/diskspace')]);$('#systemSettings').innerHTML=`<div class="formgrid"><div><b>Version</b><div class="muted">${esc(st.version)}</div></div><div><b>Database</b><div class="muted">${esc(st.database)}</div></div><div><b>Health</b><div class="state ${h.status==='ok'?'good':h.status==='warning'?'warn':'bad'}">${esc(h.status)}</div></div><div><b>Tracked media files</b><div class="muted">${st.media_files}</div></div></div><div class="divider"></div>${d.length?`<div class="tablewrap"><table class="table"><thead><tr><th>Scene Root</th><th>Path</th><th>Free</th></tr></thead><tbody>${d.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.path)}</td><td>${x.exists?bytes(x.free_bytes):'Missing'}</td></tr>`).join('')}</tbody></table></div>`:empty('No scene root folder configured.')}`;return}
}
async function saveSetting(path,body){try{await api(path,patch(body));notify('Settings saved.','ok');settings()}catch(e){notify(e.message,'error')}}
async function renderIndexers(){let el=$('#settingsBody'),rows=settingsCache.newznab_indexers;el.innerHTML=`<div class="settings-panel"><h2>Newznab Indexers</h2><p>Usenet indexers used for adult scene search and RSS.</p><div id="indexers">${(rows.length?rows:[{}]).map(indexerRow).join('')}</div><div class="actions"><button class="btn" id="addIndexer">＋ Add Indexer</button><button class="btn primary" id="saveIndexers">Save Indexers</button></div></div>`;$('#addIndexer').onclick=()=>$('#indexers').insertAdjacentHTML('beforeend',indexerRow({}));$('#indexers').onclick=e=>{let b=e.target.closest('[data-remove-indexer]');if(b)b.closest('.indexer').remove()};$('#saveIndexers').onclick=async()=>{let indexers=$$('.indexer').map(r=>({name:r.querySelector('[data-k=name]').value.trim(),url:r.querySelector('[data-k=url]').value.trim(),api_key:r.querySelector('[data-k=key]').value.trim()||null,adult_categories:r.querySelector('[data-k=cats]').value.split(',').map(x=>Number(x.trim())).filter(Boolean),enabled:r.querySelector('[data-k=enabled]').value==='true',rss_enabled:r.querySelector('[data-k=rss]').value==='true',priority:Number(r.querySelector('[data-k=priority]').value||25)})).filter(x=>x.name&&x.url);try{await api('/api/settings/newznab',patch({indexers}));notify('Indexers saved.','ok');settings()}catch(e){notify(e.message,'error')}}}
function indexerRow(x={}){return `<div class="indexer"><div class="indexer-grid"><div class="field"><label>Name</label><input class="input" data-k="name" value="${esc(x.name||'')}"></div><div class="field"><label>API URL</label><input class="input" data-k="url" value="${esc(x.url||'')}"></div><div class="field"><label>API key</label><input class="input" type="password" data-k="key" placeholder="${x.api_key_configured?'Configured — blank keeps current':''}"></div><div class="field"><label>Priority</label><input class="input" type="number" data-k="priority" value="${x.priority||25}"></div><div class="field"><label>Adult categories</label><input class="input" data-k="cats" value="${esc((x.adult_categories||[6000,6010,6020,6040]).join(','))}"></div><div class="field"><label>Enabled</label><select data-k="enabled"><option value="true" ${x.enabled!==false?'selected':''}>Yes</option><option value="false" ${x.enabled===false?'selected':''}>No</option></select></div><div class="field"><label>RSS</label><select data-k="rss"><option value="true" ${x.rss_enabled!==false?'selected':''}>Yes</option><option value="false" ${x.rss_enabled===false?'selected':''}>No</option></select></div><div class="field"><label>&nbsp;</label><button class="btn danger" data-remove-indexer>Remove</button></div></div></div>`}
function providerRow(x={}){return `<div class="provider" data-provider><div class="provider-grid"><div class="field"><label>Name</label><input class="input" data-p="name" value="${esc(x.name||'')}"></div><div class="field"><label>NNTP Host</label><input class="input" data-p="host" value="${esc(x.host||'')}"></div><div class="field"><label>Port</label><input class="input" type="number" data-p="port" value="${x.port||563}"></div><div class="field"><label>Username</label><input class="input" data-p="username" value="${esc(x.username||'')}"></div><div class="field"><label>Password</label><input class="input" type="password" data-p="password" placeholder="${x.password_configured?'Configured — blank keeps current':''}"></div><div class="field"><label>SSL/TLS</label><input class="input" value="Required" disabled><span class="hint">Plaintext NNTP is not supported.</span></div><div class="field"><label>Connections</label><input class="input" type="number" min="1" max="150" data-p="connections" value="${x.connections||8}"></div></div><div class="actions" style="margin-top:8px"><div class="field" style="width:105px"><label>Priority</label><input class="input" type="number" min="1" max="50" data-p="priority" value="${x.priority||25}"></div><div class="field" style="width:105px"><label>Enabled</label><select data-p="enabled"><option value="true" ${x.enabled!==false?'selected':''}>Yes</option><option value="false" ${x.enabled===false?'selected':''}>No</option></select></div><button class="btn small" data-test-provider>Test</button><button class="btn small danger" data-remove-provider>Remove</button></div></div>`}
function collectProviders(){return $$('[data-provider]').map(r=>({name:r.querySelector('[data-p=name]').value.trim(),host:r.querySelector('[data-p=host]').value.trim(),port:Number(r.querySelector('[data-p=port]').value||563),username:r.querySelector('[data-p=username]').value.trim(),password:r.querySelector('[data-p=password]').value.trim()||null,use_ssl:true,connections:Number(r.querySelector('[data-p=connections]').value||8),enabled:r.querySelector('[data-p=enabled]').value==='true',priority:Number(r.querySelector('[data-p=priority]').value||25)})).filter(x=>x.name&&x.host)}
async function renderDownloadSettings(){let el=$('#settingsBody'),n=settingsCache.native_usenet,tools=n.tools||{};el.innerHTML=`<div class="settings-panel"><h2>ScarletX Built-In Usenet</h2><p>ScarletX downloads NZBs directly over encrypted NNTP/TLS. Plaintext NNTP is disabled.</p><div class="formgrid"><div class="field"><label>Built-in downloader</label><select id="nativeEnabled"><option value="true" ${n.enabled?'selected':''}>Enabled</option><option value="false" ${!n.enabled?'selected':''}>Disabled</option></select></div><div class="field"><label>Adaptive connection cap</label><input class="input" id="nativeConnections" type="number" min="1" max="200" value="${n.max_connections}"><span class="hint">ScarletX starts smaller and automatically ramps toward this cap while measured throughput keeps improving. Provider values remain hard maximums.</span></div><div class="field span2"><label>Incomplete directory</label><input class="input" id="nativeIncomplete" value="${esc(n.incomplete_dir)}"></div><div class="field span2"><label>Completed directory</label><input class="input" id="nativeComplete" value="${esc(n.complete_dir)}"></div><div class="field"><label>Extra transient retries</label><input class="input" id="nativeRetries" type="number" min="0" max="3" value="${Math.min(3,n.max_retries)}"><span class="hint">Total extra attempts across all providers. Missing articles immediately rotate servers.</span></div><div class="field"><div class="speed-limit-control"><div class="speed-limit-head"><label>Download speed limit</label><output class="speed-limit-value" id="nativeSpeedValue">${Number(n.speed_limit_mb_s||0)>0?`${Number(n.speed_limit_mb_s).toFixed(Number(n.speed_limit_mb_s)%1?1:0)} MB/s`:'Unlimited'}</output></div><input class="speed-slider" id="nativeSpeed" type="range" min="0" max="250" step="0.5" value="${Math.min(250,Number(n.speed_limit_mb_s||0))}" aria-label="Download speed limit in megabytes per second"><div class="speed-scale"><span>Unlimited</span><span>50</span><span>100</span><span>150</span><span>200</span><span>250 MB/s</span></div><span class="hint">Applies to ScarletX's built-in downloader. Move fully left for no speed limit.</span></div></div><div class="field"><label>PAR2 repair</label><select id="nativeRepair"><option value="true" ${n.repair_enabled?'selected':''}>Enabled</option><option value="false" ${!n.repair_enabled?'selected':''}>Disabled</option></select></div><div class="field"><label>Unpack archives</label><select id="nativeUnpack"><option value="true" ${n.unpack_enabled?'selected':''}>Enabled</option><option value="false" ${!n.unpack_enabled?'selected':''}>Disabled</option></select></div></div><div class="divider"></div><h2>Usenet Providers</h2><p>Astraweb and Newshosting are preconfigured for this private development build. ScarletX uses TLS-only, keeps provider sessions warm, and dynamically stripes scene segments across the fastest healthy servers.</p><div id="providers">${(n.providers||[]).map(providerRow).join('')}</div><div class="actions"><button class="btn" id="addProvider">＋ Add Provider</button><button class="btn primary" id="saveNative">Save Download Settings</button></div><div class="divider"></div><h2>Post-processing tools</h2><div class="tool-grid"><span class="tool-pill ${tools.sabctools?'good':'warn'}">SIMD yEnc ${tools.sabctools?'Ready':'Fallback'}</span><span class="tool-pill ${tools.par2?'good':'warn'}">PAR2 ${tools.par2?'Ready':'Not installed'}</span><span class="tool-pill ${tools.unrar?'good':'warn'}">unrar ${tools.unrar?'Ready':'Not installed'}</span><span class="tool-pill ${tools['7z']?'good':'warn'}">7z ${tools['7z']?'Ready':'Not installed'}</span></div><p class="hint">Direct video NZBs work without these tools. RAR/PAR posts need PAR2 plus unrar or 7z for automatic repair and extraction.</p></div>`;
 const speedSlider=$('#nativeSpeed'),speedValue=$('#nativeSpeedValue');
 const updateSpeedLabel=()=>{let v=Number(speedSlider.value||0);speedValue.textContent=v>0?`${v.toFixed(v%1?1:0)} MB/s`:'Unlimited'};
 speedSlider.oninput=updateSpeedLabel;updateSpeedLabel();
 $('#addProvider').onclick=()=>$('#providers').insertAdjacentHTML('beforeend',providerRow({name:'Provider',port:563,use_ssl:true,connections:8,enabled:true,priority:25}));
 $('#providers').onclick=async e=>{let rem=e.target.closest('[data-remove-provider]');if(rem){rem.closest('[data-provider]').remove();return}let test=e.target.closest('[data-test-provider]');if(!test)return;let r=test.closest('[data-provider]'),body={name:r.querySelector('[data-p=name]').value.trim(),host:r.querySelector('[data-p=host]').value.trim(),port:Number(r.querySelector('[data-p=port]').value||563),username:r.querySelector('[data-p=username]').value.trim(),password:r.querySelector('[data-p=password]').value.trim()||null,use_ssl:true,connections:Number(r.querySelector('[data-p=connections]').value||8),enabled:r.querySelector('[data-p=enabled]').value==='true',priority:Number(r.querySelector('[data-p=priority]').value||25)};test.disabled=true;try{let out=await api('/api/download-clients/native/test',post(body));notify(`Connected to ${out.provider} in ${out.latency_ms} ms.`,'ok')}catch(err){notify(err.message,'error')}finally{test.disabled=false}};
 $('#saveNative').onclick=async()=>{try{await api('/api/settings/native-usenet',patch({enabled:val('#nativeEnabled')==='true',providers:collectProviders(),incomplete_dir:val('#nativeIncomplete'),complete_dir:val('#nativeComplete'),max_connections:Number(val('#nativeConnections')),max_retries:Number(val('#nativeRetries')),speed_limit_mb_s:Number(val('#nativeSpeed')),repair_enabled:val('#nativeRepair')==='true',unpack_enabled:val('#nativeUnpack')==='true'}));notify('Built-in Usenet settings saved.','ok');settings()}catch(e){notify(e.message,'error')}};
}
async function renderMediaSettings(){let el=$('#settingsBody'),s=settingsCache.file_management,roots=await api('/api/root-folders'),root=roots.find(x=>x.is_default)||roots[0];el.innerHTML=`<div class="settings-panel"><h2>Media Management</h2><p>Scene root folder and file organization.</p><div class="formgrid"><div class="field"><label>File management</label><select id="fileEnabled"><option value="true" ${s.enabled?'selected':''}>Enabled</option><option value="false" ${!s.enabled?'selected':''}>Disabled</option></select></div><div class="field"><label>Import mode</label><select id="importMode">${['move','copy','hardlink'].map(x=>`<option ${s.import_mode===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field span2"><label>Scene root folder</label><input class="input" id="sceneRoot" value="${esc(root?.path||'')}"><span class="hint">Use an absolute path. On TrueNAS later, this will map to your media dataset.</span></div><div class="field span2"><label>Naming template</label><input class="input" id="sceneTemplate" value="${esc(s.scene_naming_template)}"></div><div class="field"><label>Recycle bin</label><input class="input" id="recycleBin" value="${esc(s.recycle_bin_path||'')}"></div><div class="field"><label>Minimum free space (GB)</label><input class="input" id="minFree" type="number" value="${s.minimum_free_space_gb}"></div></div><div class="divider"></div><button class="btn primary" id="saveMedia">Save Media Management</button></div>`;$('#saveMedia').onclick=async()=>{try{await api('/api/settings/file-management',patch({enabled:val('#fileEnabled')==='true',scene_naming_template:val('#sceneTemplate')}));await api('/api/settings/file-management/advanced',patch({import_mode:val('#importMode'),recycle_bin_path:val('#recycleBin'),minimum_free_space_gb:Number(val('#minFree'))}));let path=val('#sceneRoot');if(path){let body={name:'Scenes',content_type:'scene',path,is_default:true,create_missing:true};if(root)await api(`/api/root-folders/${root.id}`,put(body));else await api('/api/root-folders',post(body))}notify('Media management saved.','ok');settings()}catch(e){notify(e.message,'error')}}}
boot();
</script>
</body>
