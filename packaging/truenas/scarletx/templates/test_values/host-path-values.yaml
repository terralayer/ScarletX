resources:
  limits:
    cpus: 2.0
    memory: 4096
TZ: Etc/UTC
scarletx:
  additional_envs:
  - name: SCARLETX_USENET_MAX_CONNECTIONS
    value: '16'
network:
  web_port:
    bind_mode: published
    port_number: 8080
    host_ips:
    - 127.0.0.1
run_as:
  user: 1000
  group: 1000
storage:
  config:
    type: host_path
    host_path_config:
      path: /opt/tests/mnt/scarletx-host/config
      create_host_path: true
      auto_permissions: true
  downloads:
    type: host_path
    host_path_config:
      path: /opt/tests/mnt/scarletx-host/downloads
      create_host_path: true
      auto_permissions: true
  media:
    type: host_path
    host_path_config:
      path: /opt/tests/mnt/scarletx-host/media
      create_host_path: true
      auto_permissions: true
  backups:
    type: host_path
    host_path_config:
      path: /opt/tests/mnt/scarletx-host/backups
      create_host_path: true
      auto_permissions: true
  additional_storage:
  - type: host_path
    mount_path: /archive
    read_only: true
    host_path_config:
      path: /opt/tests/mnt/scarletx-host/archive
      create_host_path: true
labels: []
