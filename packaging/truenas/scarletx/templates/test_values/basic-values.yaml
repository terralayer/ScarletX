resources:
  limits:
    cpus: 2.0
    memory: 4096

scarletx:
  additional_envs: []

network:
  web_port:
    bind_mode: published
    port_number: 30969

run_as:
  user: 568
  group: 568

ix_volumes:
  config: /opt/tests/mnt/scarletx/config
  downloads: /opt/tests/mnt/scarletx/downloads
  media: /opt/tests/mnt/scarletx/media
  backups: /opt/tests/mnt/scarletx/backups

storage:
  config:
    type: ix_volume
    ix_volume_config:
      dataset_name: config
      create_host_path: true
  downloads:
    type: ix_volume
    ix_volume_config:
      dataset_name: downloads
      create_host_path: true
  media:
    type: ix_volume
    ix_volume_config:
      dataset_name: media
      create_host_path: true
  backups:
    type: ix_volume
    ix_volume_config:
      dataset_name: backups
      create_host_path: true

labels: []
